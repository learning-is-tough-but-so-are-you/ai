<!DOCTYPE html><html lang="zh-TW"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁鐵實驗：更多物品版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1e293b;
            font-family: 'Microsoft JhengHei', sans-serif;
            touch-action: none;
            user-select: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #334155 0%, #0f172a 100%);
        }

        canvas {
            display: block;
            cursor: default; 
        }

        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            text-align: center;
            pointer-events: none;
            width: 85%;
            max-width: 500px;
            border: 1px solid #60a5fa;
            transition: all 0.3s ease;
            z-index: 10;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            color: #1e293b;
        }

        p {
            margin: 0;
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .status-highlight {
            color: #ef4444;
            font-weight: bold;
        }

        .reset-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            pointer-events: auto;
            font-weight: bold;
            transition: transform 0.1s;
            z-index: 10;
        }
        .reset-btn:active {
            transform: scale(0.95);
        }

        .mobile-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            display: none;
            pointer-events: none;
            text-align: center;
            border: 1px solid #fff;
            z-index: 20;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="simCanvas"></canvas>
    
    <button class="reset-btn" onclick="resetExperiment()">重置分佈</button>

    <div class="ui-panel">
        <h1 id="status-title">請拖曳磁棒！</h1>
        <p id="status-desc">畫面中有許多新物品，試著找出哪些會被吸引？</p>
    </div>

    <div class="mobile-hint" id="startHint">按住磁棒來移動</div>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const statusTitle = document.getElementById('status-title');
const statusDesc = document.getElementById('status-desc');
const startHint = document.getElementById('startHint');

let width, height;
let magnet = { x: 0, y: 0 };
let isDragging = false;
let dragOffset = { x: 0, y: 0 };
const magnetDims = { w: 180, h: 50 };

const ATTRACT_RANGE = 250; 

let items = [];

// --- 擴充後的物品清單 ---
const ITEM_TYPES = [
    // === 磁性物品 (Magnetic) ===
    { name: '鐵萬字夾', material: '鐵 (Iron)', magnetic: true, icon: '📎' },
    { name: '鐵釘', material: '鐵 (Iron)', magnetic: true, icon: '🔩' },
    { name: '鈷礦石', material: '鈷 (Cobalt)', magnetic: true, icon: '🪨' },
    { name: '鎳鉻線', material: '鎳鉻合金 (Nichrome)', magnetic: true, icon: '〰️' },
    { name: '不鏽鋼板手', material: '不鏽鋼 (Stainless Steel)', magnetic: true, icon: '🔧' },
    { name: '鋼剪刀', material: '鋼 (Steel)', magnetic: true, icon: '✂️' }, // 新增
    { name: '電池', material: '鋼殼 (Steel Case)', magnetic: true, icon: '🔋' }, // 新增
    { name: '鐵鑰匙', material: '鐵 (Iron)', magnetic: true, icon: '🗝️' }, // 新增

    // === 非磁性物品 (Non-Magnetic) ===
    { name: '金幣', material: '金 (Gold)', magnetic: false, icon: '🪙' },
    { name: '銅幣', material: '銅 (Copper)', magnetic: false, icon: '🟠' },
    { name: '鋁罐', material: '鋁 (Aluminum)', magnetic: false, icon: '🥫' },
    { name: '銅線', material: '銅 (Copper)', magnetic: false, icon: '➰' },
    { name: '銀湯匙', material: '銀 (Silver)', magnetic: false, icon: '🥄' },
    { name: '橡皮鴨', material: '橡膠 (Rubber)', magnetic: false, icon: '🦆' }, // 新增
    { name: '木鉛筆', material: '木頭 (Wood)', magnetic: false, icon: '✏️' }, // 新增
    { name: '玻璃珠', material: '玻璃 (Glass)', magnetic: false, icon: '🔮' }, // 新增
    { name: '鑽石戒指', material: '金/碳 (Gold/Carbon)', magnetic: false, icon: '💍' }, // 新增
    { name: '塑膠瓶', material: '塑膠 (Plastic)', magnetic: false, icon: '🧴' }, // 新增
    { name: '樹葉', material: '植物纖維 (Plant)', magnetic: false, icon: '🍃' } // 新增
];

class Item {
    constructor(type) {
        this.type = type;
        let validPosition = false;
        // 確保物品不會一開始就生在磁鐵正中間
        while (!validPosition) {
            this.x = Math.random() * (width - 80) + 40;
            this.y = Math.random() * (height - 80) + 40;
            const dx = this.x - width / 2;
            const dy = this.y - height / 2;
            // 距離中心遠一點，避免一開始就吸住
            if (Math.sqrt(dx*dx + dy*dy) > 250) validPosition = true;
        }
        this.angle = Math.random() * Math.PI * 2;
        this.isStuck = false;
        this.offsetX = 0;
        this.offsetY = 0;
    }

    update() {
        const dx = magnet.x - this.x;
        const dy = magnet.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (this.isStuck) {
            const targetX = magnet.x + this.offsetX;
            const targetY = magnet.y + this.offsetY;
            this.x += (targetX - this.x) * 0.25;
            this.y += (targetY - this.y) * 0.25;
            if (dist > ATTRACT_RANGE) this.isStuck = false;
            else updateInfo(this.type, true);
            return;
        }

        if (this.type.magnetic) {
            if (dist < ATTRACT_RANGE) {
                const speedFactor = 0.04; // 稍微加快一點吸附速度
                this.x += dx * speedFactor;
                this.y += dy * speedFactor;
                this.angle += 0.05;
                if (dist < 50) {
                    this.isStuck = true;
                    this.offsetX = this.x - magnet.x;
                    this.offsetY = this.y - magnet.y;
                    updateInfo(this.type, true);
                }
            }
        } else {
            if (dist < 70) updateInfo(this.type, false);
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // 1. 繪製圖示 (旋轉)
        ctx.save();
        ctx.rotate(this.angle);
        
        ctx.shadowColor = this.type.magnetic ? 'rgba(255, 255, 255, 0.4)' : 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = this.type.magnetic ? 15 : 5;

        ctx.font = "36px Arial"; // 稍微縮小字體以適應更多物品
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.type.icon, 0, 0);
        ctx.restore();

        // 2. 繪製名稱標籤 (不旋轉)
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "bold 12px 'Microsoft JhengHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;
        
        ctx.fillText(this.type.name, 0, 22);

        ctx.restore();
    }
}

function isInsideMagnet(mx, my) {
    return mx > magnet.x - magnetDims.w/2 - 20 && 
           mx < magnet.x + magnetDims.w/2 + 20 &&
           my > magnet.y - magnetDims.h/2 - 20 &&
           my < magnet.y + magnetDims.h/2 + 20;
}

function init() {
    resize();
    resetExperiment();
    window.addEventListener('resize', resize);
    
    const handleStart = (x, y) => {
        if (isInsideMagnet(x, y)) {
            isDragging = true;
            dragOffset.x = x - magnet.x;
            dragOffset.y = y - magnet.y;
            canvas.style.cursor = 'grabbing';
            startHint.style.display = 'none';
        }
    };

    const handleMove = (x, y) => {
        if (isDragging) {
            magnet.x = x - dragOffset.x;
            magnet.y = y - dragOffset.y;
        }
        canvas.style.cursor = isInsideMagnet(x, y) ? (isDragging ? 'grabbing' : 'grab') : 'default';
    };

    canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', () => { 
        isDragging = false; 
        canvas.style.cursor = 'default';
    });

    canvas.addEventListener('touchstart', e => {
        const t = e.touches[0];
        handleStart(t.clientX, t.clientY);
        if(isInsideMagnet(t.clientX, t.clientY)) e.preventDefault();
    }, { passive: false });
    
    window.addEventListener('touchmove', e => {
        if(isDragging) e.preventDefault();
        const t = e.touches[0];
        handleMove(t.clientX, t.clientY);
    }, { passive: false });
    
    window.addEventListener('touchend', () => { isDragging = false; });
    
    animate();
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}

function resetExperiment() {
    magnet.x = width / 2;
    magnet.y = height / 2;
    isDragging = false;
    items = [];
    
    // 隨機打亂物品順序
    let shuffled = [...ITEM_TYPES].sort(() => 0.5 - Math.random());

    // 根據螢幕寬度決定生成數量，避免手機版太擁擠
    // 如果是寬螢幕，顯示全部；如果是手機，顯示隨機 14 個
    let itemsToShow = (width > 768) ? shuffled : shuffled.slice(0, 14);

    itemsToShow.forEach(type => {
        items.push(new Item(type));
    });
    
    statusTitle.innerText = "請拖曳磁棒！";
    statusDesc.innerText = "畫面中有許多新物品，試著找出哪些會被吸引？";
    statusTitle.style.color = "#1e293b";
    
    if (width < 768) {
        startHint.style.display = 'block';
        setTimeout(() => { startHint.style.display = 'none'; }, 3000);
    }
}

let lastUpdate = 0;
function updateInfo(itemType, isAttracted) {
    const now = Date.now();
    if (now - lastUpdate < 500) return;

    if (isAttracted) {
        statusTitle.innerText = `吸住了！這是 ${itemType.name}`;
        statusTitle.style.color = "#2563eb";
        statusDesc.innerHTML = `材質是 <span class="status-highlight">${itemType.material}</span>。`;
    } else {
        statusTitle.innerText = `沒反應？這是 ${itemType.name}`;
        statusTitle.style.color = "#64748b";
        statusDesc.innerHTML = `材質是 <span class="status-highlight">${itemType.material}</span>。`;
    }
    lastUpdate = now;
}

function drawMagneticField() {
    if (!isDragging) return;

    const x = magnet.x;
    const y = magnet.y;
    const time = Date.now() / 1000;
    
    ctx.save();
    ctx.translate(x, y);

    for (let i = 0; i < 3; i++) {
        const progress = (time + i * 0.33) % 1; 
        const radius = progress * ATTRACT_RANGE;
        const alpha = 1 - progress;

        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(96, 165, 250, ${alpha * 0.5})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0, 0, ATTRACT_RANGE, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(96, 165, 250, 0.2)';
    ctx.setLineDash([5, 5]);
    ctx.stroke();

    ctx.restore();
}

function drawMagnet() {
    const x = magnet.x;
    const y = magnet.y;
    const w = magnetDims.w;
    const h = magnetDims.h;
    const depth = 10;

    ctx.save();
    ctx.translate(x, y);
    
    if (isDragging) {
        ctx.scale(1.1, 1.1);
    }

    const pulse = Math.sin(Date.now() / 200) * 5 + 15; 
    ctx.shadowColor = 'rgba(59, 130, 246, 0.8)';
    ctx.shadowBlur = isDragging ? pulse + 20 : pulse;
    
    let gradRed = ctx.createLinearGradient(-w/2, -h/2, -w/2, h/2);
    gradRed.addColorStop(0, '#dc2626');
    gradRed.addColorStop(0.4, '#f87171');
    gradRed.addColorStop(1, '#991b1b');
    ctx.fillStyle = gradRed;
    ctx.fillRect(-w/2, -h/2, w/2, h);

    let gradBlue = ctx.createLinearGradient(0, -h/2, 0, h/2);
    gradBlue.addColorStop(0, '#1d4ed8');
    gradBlue.addColorStop(0.4, '#60a5fa');
    gradBlue.addColorStop(1, '#1e3a8a');
    ctx.fillStyle = gradBlue;
    ctx.fillRect(0, -h/2, w/2, h);

    ctx.shadowBlur = 0; 
    ctx.fillStyle = '#7f1d1d';
    ctx.fillRect(-w/2, h/2, w/2, depth);
    ctx.fillStyle = '#172554';
    ctx.fillRect(0, h/2, w/2, depth);

    ctx.beginPath();
    ctx.moveTo(w/2, -h/2);
    ctx.lineTo(w/2 + depth, -h/2 + depth);
    ctx.lineTo(w/2 + depth, h/2 + depth);
    ctx.lineTo(w/2, h/2);
    ctx.fillStyle = '#0f172a';
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(-w/2, -h/2 + 10, w, 8);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'black';
    ctx.shadowBlur = 4;
    ctx.fillText('N', -w/4, 0);
    ctx.fillText('S', w/4, 0);

    ctx.restore();
}

function animate() {
    ctx.clearRect(0, 0, width, height);

    items.forEach(item => {
        if (!item.isStuck) {
            item.update();
            item.draw();
        }
    });

    drawMagneticField();
    drawMagnet();

    items.forEach(item => {
        if (item.isStuck) {
            item.update();
            item.draw();
        }
    });

    requestAnimationFrame(animate);
}

init();

</script>


</body></html>
