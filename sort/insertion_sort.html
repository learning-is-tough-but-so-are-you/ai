<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插入排序法 (Insertion Sort) 互動教學動畫</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }
        /* 程式碼高亮動畫 */
        .code-line {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .code-line.active {
            background-color: rgba(168, 85, 247, 0.2); /* 紫色高亮 */
            border-left-color: #a855f7;
            font-weight: bold;
            transform: translateX(6px);
        }
        /* 學生卡片平滑動畫 */
        .student-container {
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .student-card {
            transition: all 0.4s ease;
        }
        /* 關鍵值（被抽起拿在手上） */
        .student-card.key-selected {
            transform: translateY(-40px);
            box-shadow: 0 20px 25px -5px rgba(168, 85, 247, 0.4), 0 10px 10px -5px rgba(168, 85, 247, 0.4);
            border-color: #a855f7;
            background-color: #fdf4ff;
            z-index: 50;
        }
        /* 正在被比對的左側元素 */
        .student-card.comparing {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3), 0 4px 6px -4px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        /* 已排序的區域（左邊相對有序的部分） */
        .student-card.sorted-zone {
            border-color: #c084fc;
            background-color: #faf5ff;
        }
        /* 正在往右移動讓出位置的學生 */
        .student-card.shifting {
            transform: translateX(10px) scale(0.95);
            opacity: 0.8;
            border-color: #f43f5e;
            background-color: #fff1f2;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <!-- 頂部導覽列 -->
    <header class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg p-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white text-purple-600 p-2 rounded-lg shadow">
                    <i class="fa-solid fa-clone text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-wide">插入排序法 (Insertion Sort)</h1>
                    <p class="text-xs text-purple-100">撲克牌理牌法：抽出、比對、讓位、插入！</p>
                </div>
            </div>
            
            <!-- 模式切換器 -->
            <div class="bg-white/15 p-1 rounded-full flex gap-1 border border-white/20">
                <button id="mode-desc" onclick="switchMode('DESC')" class="px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 bg-white text-purple-700 shadow">
                    <i class="fa-solid fa-arrow-down-9-1 mr-1"></i> 由大至小 (降序)
                </button>
                <button id="mode-asc" onclick="switchMode('ASC')" class="px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 text-white hover:bg-white/10">
                    <i class="fa-solid fa-arrow-up-1-9 mr-1"></i> 由小至大 (升序)
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- 左側：動畫演示區 (佔 7 格) -->
        <div class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- 控制面板 -->
            <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-100 flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-2">
                    <button onclick="prevStep()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium text-sm flex items-center gap-1 transition">
                        <i class="fa-solid fa-backward-step"></i> 上一步
                    </button>
                    <button id="play-btn" onclick="togglePlay()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-semibold text-sm flex items-center gap-1.5 shadow-md shadow-purple-500/20 transition">
                        <i class="fa-solid fa-play" id="play-icon"></i> <span id="play-text">自動播放</span>
                    </button>
                    <button onclick="nextStep()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm flex items-center gap-1.5 shadow-md shadow-blue-600/20 transition">
                        下一步 <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>

                <div class="flex gap-2">
                    <button onclick="resetData()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium text-sm flex items-center gap-1 transition">
                        <i class="fa-solid fa-rotate-left"></i> 重設
                    </button>
                    <button onclick="randomizeHeights()" class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg font-medium text-sm flex items-center gap-1 transition">
                        <i class="fa-solid fa-shuffle"></i> 隨機身高
                    </button>
                </div>
            </div>

            <!-- 動態畫布區 -->
            <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-100 flex-grow flex flex-col justify-between min-h-[420px] relative overflow-hidden">
                
                <!-- 狀態指示器 -->
                <div class="flex justify-between items-center text-xs text-slate-400 font-medium">
                    <div>列表長度 (len): <span id="list-len" class="text-slate-700 font-bold">8</span></div>
                    <div class="flex gap-4">
                        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-purple-400 rounded-full inline-block"></span> 抽出的牌 (key)</span>
                        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-500 rounded-full inline-block"></span> 比較中</span>
                        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-rose-400 rounded-full inline-block"></span> 往後讓位</span>
                    </div>
                </div>

                <!-- 學生隊列容器 -->
                <div class="relative w-full h-76 flex justify-around items-end mt-6 px-2" id="students-row">
                    <!-- 由 JavaScript 動態生成 -->
                </div>

                <!-- 指針標記 (i, j) -->
                <div class="w-full relative h-10 border-t border-slate-100 mt-4">
                    <div id="pointer-i" class="absolute top-1 text-center transition-all duration-300" style="width: 80px; left: 0%;">
                        <span class="inline-block bg-purple-100 text-purple-700 text-[10px] font-extrabold px-1.5 py-0.5 rounded shadow-sm border border-purple-200">未排起點 i</span>
                        <div class="text-purple-500 mt-0.5"><i class="fa-solid fa-caret-up text-lg leading-none"></i></div>
                    </div>
                    <div id="pointer-j" class="absolute top-1 text-center transition-all duration-300" style="width: 80px; left: 0%;">
                        <span class="inline-block bg-blue-100 text-blue-700 text-[10px] font-extrabold px-1.5 py-0.5 rounded shadow-sm border border-blue-200">手指向 j</span>
                        <div class="text-blue-500 mt-0.5"><i class="fa-solid fa-caret-up text-lg leading-none"></i></div>
                    </div>
                </div>

                <!-- 底部對話泡泡 (詳細中文解說) -->
                <div class="mt-4 bg-purple-50 border border-purple-100 rounded-xl p-4 flex items-start gap-3 relative shadow-sm">
                    <div class="bg-purple-500 text-white rounded-full p-2 flex-shrink-0">
                        <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-purple-900 text-sm mb-0.5" id="explain-title">準備就緒</h4>
                        <p class="text-xs text-purple-800 leading-relaxed" id="explain-desc">點擊「下一步」來觀察插入排序法是如何像「整理撲克牌」一樣，將學生們排好身高的！</p>
                    </div>
                </div>

            </div>

        </div>

        <!-- 右側：程式碼 + 變數面板 (佔 5 格) -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- 變數即時監視面板 -->
            <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/5 rounded-full pointer-events-none"></div>
                
                <h3 class="font-bold text-sm text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-table-list text-purple-400"></i> 手牌變數監控 (Variables)
                </h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <div class="text-[10px] text-slate-400">當前抽牌位置 (i)</div>
                        <div class="text-2xl font-black text-purple-400" id="var-i">-</div>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <div class="text-[10px] text-slate-400">左移比較手勢 (j)</div>
                        <div class="text-2xl font-black text-blue-400" id="var-j">-</div>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10 col-span-2">
                        <div class="text-[10px] text-slate-400 flex justify-between">
                            <span>手上拿著的新牌 (key)</span>
                        </div>
                        <div class="text-2xl font-black text-amber-400" id="var-key">-</div>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10 col-span-2">
                        <div class="text-[10px] text-slate-400">目前陣列狀態 (mark)</div>
                        <div class="text-sm font-mono text-emerald-400 mt-1 truncate" id="var-mark">-</div>
                    </div>
                </div>
            </div>

            <!-- Python 程式碼展示面板 -->
            <div class="bg-slate-900 text-slate-100 rounded-2xl shadow-xl border border-slate-800 overflow-hidden flex-grow flex flex-col">
                <div class="bg-slate-800 px-4 py-3 flex justify-between items-center border-b border-slate-950">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-yellow-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                        <span class="text-xs font-mono text-slate-400 ml-2">insertion_sort.py</span>
                    </div>
                    <span class="text-[10px] bg-purple-500/10 text-purple-400 px-2 py-0.5 rounded font-mono border border-purple-500/20">Python 3</span>
                </div>
                
                <!-- Python 程式代碼 -->
                <div class="p-5 font-mono text-xs md:text-sm overflow-auto leading-relaxed flex-grow" id="code-box">
                    <!-- 由 JavaScript 動態載入 -->
                </div>
            </div>

        </div>

    </main>

    <!-- 底部資訊 -->
    <footer class="bg-slate-800 text-slate-400 text-center py-3 border-t border-slate-700 text-xs">
        <p>© 插入排序法互動式教學網頁 | 手牌理牌動畫示範工具</p>
    </footer>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // 初始學生身高數據
        const INITIAL_HEIGHTS = [156, 178, 142, 185, 168, 150, 172, 161];
        let mark = [...INITIAL_HEIGHTS];
        
        // 排序模式：'DESC' (由大至小, 圖片主程式), 'ASC' (由小至大)
        let sortMode = 'DESC'; 

        // 逐步追踪的狀態記錄
        let states = [];
        let currentStateIndex = 0;
        let playInterval = null;

        // 可愛學生的風格造型，與身高關聯以保持一致性
        const STUDENT_STYLES = [
            { bg: 'from-pink-400 to-rose-500', face: '（╹◡╹）' },
            { bg: 'from-purple-500 to-indigo-600', face: '（.◇.）' },
            { bg: 'from-blue-400 to-cyan-500', face: '（.∀.）' },
            { bg: 'from-emerald-400 to-teal-500', face: '（☉∀☉）' },
            { bg: 'from-yellow-400 to-amber-500', face: '（´▽`）' },
            { bg: 'from-orange-400 to-red-500', face: '（o' + 'ω' + 'o）' },
            { bg: 'from-violet-400 to-fuchsia-500', face: '（≧∇≦）' },
            { bg: 'from-lime-400 to-green-500', face: '（◕‿◕）' }
        ];

        window.onload = function() {
            renderCode();
            generateStates();
            renderState(0);
        };

        function switchMode(mode) {
            if (sortMode === mode) return;
            sortMode = mode;
            
            const descBtn = document.getElementById('mode-desc');
            const ascBtn = document.getElementById('mode-asc');
            
            if (mode === 'DESC') {
                descBtn.className = "px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 bg-white text-purple-700 shadow";
                ascBtn.className = "px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 text-white hover:bg-white/10";
            } else {
                ascBtn.className = "px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 bg-white text-purple-700 shadow";
                descBtn.className = "px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 text-white hover:bg-white/10";
            }

            pause();
            renderCode();
            resetData();
        }

        function resetData() {
            mark = [...INITIAL_HEIGHTS];
            currentStateIndex = 0;
            generateStates();
            renderState(0);
        }

        function randomizeHeights() {
            mark = [];
            for (let i = 0; i < INITIAL_HEIGHTS.length; i++) {
                mark.push(Math.floor(Math.random() * 51) + 140);
            }
            currentStateIndex = 0;
            generateStates();
            renderState(0);
        }

        function renderCode() {
            const codeBox = document.getElementById('code-box');
            if (sortMode === 'DESC') {
                codeBox.innerHTML = `
                    <div class="code-line py-1 px-2 rounded" id="line-1"><span class="text-purple-400">for</span> i <span class="text-purple-400">in</span> <span class="text-blue-400">range</span>(<span class="text-amber-400">1</span>, <span class="text-blue-400">len</span>(mark)):</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-2">key = mark[i]</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-3">j = i - <span class="text-amber-400">1</span></div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-4"><span class="text-purple-400">while</span> j &gt;= <span class="text-amber-400">0</span> <span class="text-purple-400">and</span> key &gt; mark[j]:</div>
                    <div class="code-line py-1 px-2 rounded pl-12" id="line-5">mark[j+<span class="text-amber-400">1</span>] = mark[j]</div>
                    <div class="code-line py-1 px-2 rounded pl-12" id="line-6">j = j - <span class="text-amber-400">1</span></div>
                    <div class="code-line py-1 px-2 rounded pl-6 mt-2" id="line-7">mark[j+<span class="text-amber-400">1</span>] = key</div>
                `;
            } else {
                codeBox.innerHTML = `
                    <div class="code-line py-1 px-2 rounded" id="line-1"><span class="text-purple-400">for</span> i <span class="text-purple-400">in</span> <span class="text-blue-400">range</span>(<span class="text-amber-400">1</span>, <span class="text-blue-400">len</span>(mark)):</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-2">key = mark[i]</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-3">j = i - <span class="text-amber-400">1</span></div>
                    <div class="code-line py-1 px-2 rounded pl-6 text-orange-400 font-bold" id="line-4"><span class="text-purple-400">while</span> j &gt;= <span class="text-amber-400">0</span> <span class="text-purple-400">and</span> key &lt; mark[j]:</div>
                    <div class="code-line py-1 px-2 rounded pl-12" id="line-5">mark[j+<span class="text-amber-400">1</span>] = mark[j]</div>
                    <div class="code-line py-1 px-2 rounded pl-12" id="line-6">j = j - <span class="text-amber-400">1</span></div>
                    <div class="code-line py-1 px-2 rounded pl-6 mt-2" id="line-7">mark[j+<span class="text-amber-400">1</span>] = key</div>
                `;
            }
        }

        // 生成插入排序逐步狀態機
        function generateStates() {
            states = [];
            let tempMark = [...mark];
            const n = tempMark.length;

            // 初始狀態 (State 0)
            states.push({
                line: 0,
                mark: [...tempMark],
                i: '-',
                j: '-',
                key: '-',
                explainTitle: "準備開始理牌",
                explainDesc: "左邊第一個學生（index 0）自己算是一組已排序好的隊伍。我們將從 index 1 的同學開始，像摸撲克牌一樣進行插入排序！",
                keyIndex: null,
                comparingIndex: null,
                shiftingIndices: [],
                insertedIndex: null
            });

            for (let i = 1; i < n; i++) {
                // 1. 進入外圈
                states.push({
                    line: 1,
                    mark: [...tempMark],
                    i: i,
                    j: '-',
                    key: '-',
                    explainTitle: `步驟 1: 選擇新牌 i = ${i}`,
                    explainDesc: `我們要處理 index ${i} 的學生（${tempMark[i]}cm）。準備把他與他左邊已經排好隊伍的學生進行比對。`,
                    keyIndex: i,
                    comparingIndex: null,
                    shiftingIndices: [],
                    insertedIndex: null
                });

                // 2. 取出關鍵值 key
                let key = tempMark[i];
                states.push({
                    line: 2,
                    mark: [...tempMark],
                    i: i,
                    j: '-',
                    key: key,
                    explainTitle: `步驟 2: 抽出牌 key = ${key}`,
                    explainDesc: `抽出 index ${i} 的學生（${key}cm）拿在手上（在動畫中浮起）。此時，他的位置暫時騰空出來了。`,
                    keyIndex: i,
                    comparingIndex: null,
                    shiftingIndices: [],
                    insertedIndex: null
                });

                // 3. 初始化指標 j = i - 1
                let j = i - 1;
                states.push({
                    line: 3,
                    mark: [...tempMark],
                    i: i,
                    j: j,
                    key: key,
                    explainTitle: `步驟 3: 手指指向左邊第一個 j = ${j}`,
                    explainDesc: `伸出左移指標 j 指向左邊相鄰的同學（index ${j}，${tempMark[j]}cm），準備開始向左尋找插入的位置。`,
                    keyIndex: i,
                    comparingIndex: j,
                    shiftingIndices: [],
                    insertedIndex: null
                });

                // 4. 進入內圈比對
                let shiftingTemp = [];
                
                while (true) {
                    // while 條件評估狀態
                    let inBounds = j >= 0;
                    let comparison = false;
                    if (inBounds) {
                        comparison = sortMode === 'DESC' ? (key > tempMark[j]) : (key < tempMark[j]);
                    }

                    states.push({
                        line: 4,
                        mark: [...tempMark],
                        i: i,
                        j: j,
                        key: key,
                        explainTitle: `步驟 4: 比對大小 (while 條件)`,
                        explainDesc: j >= 0 
                            ? `比對手上的 ${key}cm 是否${sortMode === 'DESC' ? '大於' : '小於'}左邊 index ${j} 的 ${tempMark[j]}cm？結果：${comparison ? '是的！' : '沒有。'}`
                            : `指標 j 已移出邊界（j < 0），比對結束。`,
                        keyIndex: i,
                        comparingIndex: j >= 0 ? j : null,
                        shiftingIndices: [...shiftingTemp],
                        insertedIndex: null
                    });

                    if (inBounds && comparison) {
                        // 5. 往右退位 mark[j+1] = mark[j]
                        tempMark[j + 1] = tempMark[j];
                        shiftingTemp.push(j);
                        states.push({
                            line: 5,
                            mark: [...tempMark],
                            i: i,
                            j: j,
                            key: key,
                            explainTitle: `步驟 5: 擋路了，向右跨一步！`,
                            explainDesc: `因為手上的同學（${key}cm）${sortMode === 'DESC' ? '比較高' : '比較矮'}，所以 index ${j} 的同學（${tempMark[j]}cm）往右跨一步，讓出空間。`,
                            keyIndex: i,
                            comparingIndex: j,
                            shiftingIndices: [...shiftingTemp],
                            insertedIndex: null
                        });

                        // 6. 指標左移 j = j - 1
                        j = j - 1;
                        states.push({
                            line: 6,
                            mark: [...tempMark],
                            i: i,
                            j: j,
                            key: key,
                            explainTitle: `步驟 6: 指標左移 j = ${j}`,
                            explainDesc: `指標 j 再往左邊移一格（j = ${j}），繼續檢查左邊有沒有更適合的位置。`,
                            keyIndex: i,
                            comparingIndex: j >= 0 ? j : null,
                            shiftingIndices: [...shiftingTemp],
                            insertedIndex: null
                        });
                    } else {
                        // 條件不滿足，跳出 while
                        break;
                    }
                }

                // 7. 插入關鍵值 mark[j+1] = key
                tempMark[j + 1] = key;
                states.push({
                    line: 7,
                    mark: [...tempMark],
                    i: i,
                    j: j,
                    key: key,
                    explainTitle: `步驟 7: 插入空位中！`,
                    explainDesc: `找到了正確的位置！將手上拿著的同學（${key}cm）插入到 index ${j+1} 的空缺位置中。`,
                    keyIndex: null,
                    comparingIndex: null,
                    shiftingIndices: [],
                    insertedIndex: j + 1
                });
            }

            // 完成排序 (State Final)
            states.push({
                line: 0,
                mark: [...tempMark],
                i: '-',
                j: '-',
                key: '-',
                explainTitle: "🎉 全體手牌理畢！",
                explainDesc: sortMode === 'DESC' 
                    ? "太神奇了！所有的學生都像整理撲克牌一樣，完美地「由大至小（降序）」插空位排好囉！"
                    : "恭喜！您成功完成了「試想想」的升序思考題！全體學生已「由小至大」排列整齊！",
                keyIndex: null,
                comparingIndex: null,
                shiftingIndices: [],
                insertedIndex: null
            });
        }

        // 渲染畫面
        function renderState(stateIndex) {
            const state = states[stateIndex];
            if (!state) return;

            // 監控面板更新
            document.getElementById('var-i').innerText = state.i;
            document.getElementById('var-j').innerText = state.j;
            document.getElementById('var-key').innerText = state.key !== '-' ? `${state.key} cm` : '-';
            document.getElementById('var-mark').innerText = JSON.stringify(state.mark);

            // 更新說明文字
            document.getElementById('explain-title').innerText = state.explainTitle;
            document.getElementById('explain-desc').innerText = state.explainDesc;

            // 程式碼高亮
            document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
            if (state.line > 0) {
                const activeLine = document.getElementById(`line-${state.line}`);
                if (activeLine) activeLine.classList.add('active');
            }

            // 指針定位
            const rowWidth = document.getElementById('students-row').offsetWidth;
            const colWidth = rowWidth / state.mark.length;

            if (state.i !== '-' && state.i !== null) {
                document.getElementById('pointer-i').style.display = 'block';
                document.getElementById('pointer-i').style.left = `${state.i * colWidth + (colWidth/2 - 40)}px`;
            } else {
                document.getElementById('pointer-i').style.display = 'none';
            }

            if (state.j !== '-' && state.j >= 0) {
                document.getElementById('pointer-j').style.display = 'block';
                document.getElementById('pointer-j').style.left = `${state.j * colWidth + (colWidth/2 - 40)}px`;
            } else {
                document.getElementById('pointer-j').style.display = 'none';
            }

            // 渲染學生
            const studentsRow = document.getElementById('students-row');
            studentsRow.innerHTML = '';

            state.mark.forEach((height, idx) => {
                const minH = 140;
                const maxH = 190;
                const percent = 50 + ((height - minH) / (maxH - minH)) * 50;

                let statusClasses = '';
                let extraBadge = '';

                // 本輪要排的 key (浮空狀態)
                if (state.keyIndex === idx && state.line >= 2 && state.line <= 6) {
                    statusClasses = 'key-selected';
                    extraBadge = `
                        <div class="absolute -top-7 left-1/2 -translate-x-1/2 flex flex-col items-center animate-bounce">
                            <i class="fa-solid fa-hand-pointer text-purple-500 text-xs"></i>
                            <span class="text-[9px] bg-purple-500 text-white font-black px-1 rounded shadow-sm leading-tight">手拿新牌</span>
                        </div>
                    `;
                }

                // 正在比對中的人
                if (state.comparingIndex === idx) {
                    statusClasses = 'comparing border-blue-500 bg-blue-50';
                    extraBadge = `
                        <div class="absolute -top-7 left-1/2 -translate-x-1/2 flex flex-col items-center">
                            <i class="fa-solid fa-magnifying-glass text-blue-500 text-xs"></i>
                            <span class="text-[9px] bg-blue-500 text-white font-black px-1 rounded shadow-sm leading-tight">比對中</span>
                        </div>
                    `;
                }

                // 正在往右移退位的人
                if (state.shiftingIndices.includes(idx)) {
                    statusClasses = 'shifting';
                }

                // 剛插入完成亮綠燈的人
                if (state.insertedIndex === idx) {
                    statusClasses = 'border-emerald-500 bg-emerald-50 scale-105';
                    extraBadge = `
                        <div class="absolute -top-7 left-1/2 -translate-x-1/2 flex flex-col items-center">
                            <i class="fa-solid fa-circle-check text-emerald-500 text-xs"></i>
                            <span class="text-[9px] bg-emerald-500 text-white font-black px-1 rounded shadow-sm leading-tight">已插入</span>
                        </div>
                    `;
                }

                // 當前判定為左側「已整理好」區域
                let isSortedZone = false;
                if (state.i !== '-') {
                    isSortedZone = idx < state.i;
                } else if (stateIndex === states.length - 1) {
                    isSortedZone = true; // 結束時全亮
                }
                
                if (isSortedZone && statusClasses === '') {
                    statusClasses = 'sorted-zone';
                }

                // 綁定固定的學生外觀以保持排序前後身分一致
                const origIdx = INITIAL_HEIGHTS.indexOf(height);
                const style = STUDENT_STYLES[origIdx !== -1 ? origIdx : idx % STUDENT_STYLES.length];

                const studentCard = document.createElement('div');
                studentCard.className = `student-container flex flex-col items-center justify-end h-full relative`;
                studentCard.style.width = `${colWidth}px`;
                
                studentCard.innerHTML = `
                    ${extraBadge}

                    <!-- 學生卡片 -->
                    <div class="student-card w-11 md:w-14 rounded-t-2xl border-2 shadow-sm flex flex-col justify-between items-center py-2 relative cursor-pointer ${statusClasses}" style="height: ${percent}%;">
                        
                        <!-- 卡通表情 -->
                        <div class="text-[10px] md:text-xs font-bold select-none text-slate-700 mt-1">
                            ${style.face}
                        </div>

                        <!-- 衣服 -->
                        <div class="w-full px-2 mt-2">
                            <div class="w-full h-4 rounded-md bg-gradient-to-r ${style.bg} flex items-center justify-center text-[8px] text-white font-black">
                                校服
                            </div>
                        </div>

                        <!-- 身高 -->
                        <div class="text-xs md:text-sm font-black tracking-tight mt-auto text-slate-800">
                            ${height}
                        </div>
                    </div>

                    <!-- Index -->
                    <div class="mt-2 text-xs font-mono font-bold text-slate-400">
                        [${idx}]
                    </div>
                `;
                studentsRow.appendChild(studentCard);
            });
        }

        // 下一步
        function nextStep() {
            if (currentStateIndex < states.length - 1) {
                currentStateIndex++;
                renderState(currentStateIndex);
            } else {
                pause();
            }
        }

        // 上一步
        function prevStep() {
            if (currentStateIndex > 0) {
                currentStateIndex--;
                renderState(currentStateIndex);
            }
        }

        // 自動播放控制
        function togglePlay() {
            if (playInterval) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            if (currentStateIndex >= states.length - 1) {
                currentStateIndex = 0;
            }
            document.getElementById('play-icon').className = "fa-solid fa-pause";
            document.getElementById('play-text').innerText = "暫停播放";
            playInterval = setInterval(() => {
                nextStep();
            }, 1200);
        }

        function pause() {
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
            document.getElementById('play-icon').className = "fa-solid fa-play";
            document.getElementById('play-text').innerText = "自動播放";
        }
    </script>
</body>
</html>
