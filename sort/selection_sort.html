<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇排序法 (Selection Sort) 互動教學動畫</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8;
        }
        /* 程式碼高亮動畫 */
        .code-line {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .code-line.active {
            background-color: rgba(251, 146, 60, 0.25); /* 橘色高亮 */
            border-left-color: #f97316;
            font-weight: bold;
            transform: translateX(6px);
        }
        /* 學生卡片平滑動畫 */
        .student-container {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .student-card {
            transition: all 0.4s ease;
        }
        .student-card.comparing {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3), 0 4px 6px -4px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .student-card.current-best {
            transform: scale(1.08);
            box-shadow: 0 10px 20px -3px rgba(234, 179, 8, 0.4), 0 4px 12px -4px rgba(234, 179, 8, 0.4);
            border-color: #eab308;
            background-color: #fef9c3;
        }
        .student-card.sorted {
            opacity: 0.85;
            filter: grayscale(20%);
            border-color: #10b981;
        }
        /* 浮空交換效果 */
        .student-card.swapping {
            transform: translateY(-25px);
            z-index: 50;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <!-- 頂部導覽列 -->
    <header class="bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-lg p-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white text-orange-600 p-2 rounded-lg shadow">
                    <i class="fa-solid fa-graduation-cap text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-wide">選擇排序法 (Selection Sort)</h1>
                    <p class="text-xs text-orange-100">用「排身高」直觀學演算法！</p>
                </div>
            </div>
            
            <!-- 模式切換器 (對應試想想思考題) -->
            <div class="bg-white/15 p-1 rounded-full flex gap-1 border border-white/20">
                <button id="mode-desc" onclick="switchMode('DESC')" class="px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 bg-white text-orange-600 shadow">
                    <i class="fa-solid fa-arrow-down-9-1 mr-1"></i> 由大至小 (降序)
                </button>
                <button id="mode-asc" onclick="switchMode('ASC')" class="px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 text-white hover:bg-white/10">
                    <i class="fa-solid fa-arrow-up-1-9 mr-1"></i> 由小至大 (升序)
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- 左側：動畫演示區 (佔 7 格) -->
        <div class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- 控制面板 -->
            <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-100 flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-2">
                    <button onclick="prevStep()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium text-sm flex items-center gap-1 transition">
                        <i class="fa-solid fa-backward-step"></i> 上一步
                    </button>
                    <button id="play-btn" onclick="togglePlay()" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-lg font-semibold text-sm flex items-center gap-1.5 shadow-md shadow-orange-500/20 transition">
                        <i class="fa-solid fa-play" id="play-icon"></i> <span id="play-text">自動播放</span>
                    </button>
                    <button onclick="nextStep()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm flex items-center gap-1.5 shadow-md shadow-blue-600/20 transition">
                        下一步 <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>

                <div class="flex gap-2">
                    <button onclick="resetData()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium text-sm flex items-center gap-1 transition">
                        <i class="fa-solid fa-rotate-left"></i> 重設
                    </button>
                    <button onclick="randomizeHeights()" class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg font-medium text-sm flex items-center gap-1 transition">
                        <i class="fa-solid fa-shuffle"></i> 隨機身高
                    </button>
                </div>
            </div>

            <!-- 動態畫布區 (學生排隊的地方) -->
            <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-100 flex-grow flex flex-col justify-between min-h-[400px] relative overflow-hidden">
                
                <!-- 狀態指示器 -->
                <div class="flex justify-between items-center text-xs text-slate-400 font-medium">
                    <div>列表長度 (len): <span id="list-len" class="text-slate-700 font-bold">8</span></div>
                    <div class="flex gap-4">
                        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-emerald-500 rounded-full inline-block"></span> 已排序</span>
                        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-yellow-400 rounded-full inline-block"></span> 當前極值</span>
                        <span class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-500 rounded-full inline-block"></span> 掃描比較</span>
                    </div>
                </div>

                <!-- 學生隊列容器 -->
                <div class="relative w-full h-72 flex justify-around items-end mt-4 px-2" id="students-row">
                    <!-- 學生卡片會在這裡由 JavaScript 動態生成 -->
                </div>

                <!-- 指針標記 (i, j) -->
                <div class="w-full relative h-10 border-t border-slate-100 mt-2">
                    <div id="pointer-i" class="absolute top-1 text-center transition-all duration-300" style="width: 80px; left: 0%;">
                        <span class="inline-block bg-orange-100 text-orange-700 text-[10px] font-extrabold px-1.5 py-0.5 rounded shadow-sm border border-orange-200">外圈 i</span>
                        <div class="text-orange-500 mt-0.5"><i class="fa-solid fa-caret-up text-lg leading-none"></i></div>
                    </div>
                    <div id="pointer-j" class="absolute top-1 text-center transition-all duration-300" style="width: 80px; left: 0%;">
                        <span class="inline-block bg-blue-100 text-blue-700 text-[10px] font-extrabold px-1.5 py-0.5 rounded shadow-sm border border-blue-200">內圈 j</span>
                        <div class="text-blue-500 mt-0.5"><i class="fa-solid fa-caret-up text-lg leading-none"></i></div>
                    </div>
                </div>

                <!-- 底部對話泡泡 (詳盡中文解說) -->
                <div class="mt-4 bg-orange-50 border border-orange-100 rounded-xl p-4 flex items-start gap-3 relative shadow-sm">
                    <div class="bg-orange-500 text-white rounded-full p-2 flex-shrink-0">
                        <i class="fa-solid fa-comment-dots text-lg"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-orange-900 text-sm mb-0.5" id="explain-title">準備就緒</h4>
                        <p class="text-xs text-orange-800 leading-relaxed" id="explain-desc">點擊「下一步」或「自動播放」開始排身高！我們將使用選擇排序法逐步將學生進行排序。</p>
                    </div>
                </div>

            </div>

        </div>

        <!-- 右側：程式碼 + 變數面板 (佔 5 格) -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- 變數即時監視面板 -->
            <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden">
                <!-- 裝飾用背景圓 -->
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/5 rounded-full pointer-events-none"></div>
                
                <h3 class="font-bold text-sm text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-heart-pulse text-rose-500"></i> 變數即時監控 (Variable Tracker)
                </h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <div class="text-[10px] text-slate-400">目前處理位置 (i)</div>
                        <div class="text-2xl font-black text-amber-400" id="var-i">-</div>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <div class="text-[10px] text-slate-400">目前掃描指針 (j)</div>
                        <div class="text-2xl font-black text-blue-400" id="var-j">-</div>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10 col-span-2">
                        <div class="text-[10px] text-slate-400 flex justify-between">
                            <span id="label-target-idx">極值索引 (max_index)</span>
                            <span class="text-amber-400 font-semibold" id="var-target-height">身高: - cm</span>
                        </div>
                        <div class="text-2xl font-black text-yellow-400" id="var-target-idx">-</div>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10 col-span-2">
                        <div class="text-[10px] text-slate-400">暫存交換變數 (temp)</div>
                        <div class="text-sm font-mono text-emerald-400 mt-1 truncate" id="var-temp">-</div>
                    </div>
                </div>
            </div>

            <!-- Python 程式碼展示面板 -->
            <div class="bg-slate-900 text-slate-100 rounded-2xl shadow-xl border border-slate-800 overflow-hidden flex-grow flex flex-col">
                <div class="bg-slate-800 px-4 py-3 flex justify-between items-center border-b border-slate-950">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-yellow-500 rounded-full"></span>
                        <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                        <span class="text-xs font-mono text-slate-400 ml-2">selection_sort.py</span>
                    </div>
                    <span class="text-[10px] bg-sky-500/10 text-sky-400 px-2 py-0.5 rounded font-mono border border-sky-500/20">Python 3</span>
                </div>
                
                <!-- Python 程式代碼 -->
                <div class="p-5 font-mono text-xs md:text-sm overflow-auto leading-relaxed flex-grow" id="code-box">
                    <!-- Python 程式碼內容將根據模式動態載入 -->
                </div>
            </div>

        </div>

    </main>

    <!-- 底部資訊 -->
    <footer class="bg-slate-800 text-slate-400 text-center py-3 border-t border-slate-700 text-xs">
        <p>© 選擇排序法互動式教學網頁 | 身高排序示範工具</p>
    </footer>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // 初始學生身高數據（公分）
        const INITIAL_HEIGHTS = [156, 178, 142, 185, 168, 150, 172, 161];
        let mark = [...INITIAL_HEIGHTS];
        
        // 排序模式：'DESC' (由大至小, 圖片主程式), 'ASC' (由小至大, 試想想紅色部分)
        let sortMode = 'DESC'; 

        // 逐步追踪的狀態記錄 (State Trace Engine)
        let states = [];
        let currentStateIndex = 0;
        let playInterval = null;

        // 可愛學生的 SVG 面部與造型組合
        const STUDENT_STYLES = [
            { bg: 'from-pink-400 to-rose-500', face: '（╹◡╹）', color: '#ff2a6d' },
            { bg: 'from-purple-500 to-indigo-600', face: '（＾◇＾）', color: '#05d9e8' },
            { bg: 'from-blue-400 to-cyan-500', face: '（・∀・）', color: '#01012b' },
            { bg: 'from-emerald-400 to-teal-500', face: '（☉∀☉）', color: '#00f5d4' },
            { bg: 'from-yellow-400 to-amber-500', face: '（*´▽`*）', color: '#ffb703' },
            { bg: 'from-orange-400 to-red-500', face: '（o' + 'ω' + 'o）', color: '#ff5400' },
            { bg: 'from-violet-400 to-fuchsia-500', face: '（≧∇≦）', color: '#7209b7' },
            { bg: 'from-lime-400 to-green-500', face: '（◕‿◕）', color: '#4cc9f0' }
        ];

        // 頁面初始化
        window.onload = function() {
            renderCode();
            generateStates();
            renderState(0);
        };

        // 切換升序/降序模式
        function switchMode(mode) {
            if (sortMode === mode) return;
            sortMode = mode;
            
            // UI 按鈕狀態切換
            const descBtn = document.getElementById('mode-desc');
            const ascBtn = document.getElementById('mode-asc');
            
            if (mode === 'DESC') {
                descBtn.className = "px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 bg-white text-orange-600 shadow";
                ascBtn.className = "px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 text-white hover:bg-white/10";
            } else {
                ascBtn.className = "px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 bg-white text-orange-600 shadow";
                descBtn.className = "px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300 text-white hover:bg-white/10";
            }

            pause();
            renderCode();
            resetData();
        }

        // 重新設定原始身高
        function resetData() {
            mark = [...INITIAL_HEIGHTS];
            currentStateIndex = 0;
            generateStates();
            renderState(0);
        }

        // 隨機亂數身高
        function randomizeHeights() {
            mark = [];
            for (let i = 0; i < INITIAL_HEIGHTS.length; i++) {
                // 產生 140 到 190 之間的身高
                mark.push(Math.floor(Math.random() * 51) + 140);
            }
            currentStateIndex = 0;
            generateStates();
            renderState(0);
        }

        // 渲染對應的 Python 程式碼
        function renderCode() {
            const codeBox = document.getElementById('code-box');
            
            // 根據模式顯示不同的程式碼
            if (sortMode === 'DESC') {
                codeBox.innerHTML = `
                    <div class="code-line py-1 px-2 rounded" id="line-1"><span class="text-pink-500">for</span> i <span class="text-pink-500">in</span> <span class="text-blue-400">range</span>(<span class="text-amber-400">0</span>, <span class="text-blue-400">len</span>(mark)):</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-2">max_index = i</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-3"><span class="text-pink-500">for</span> j <span class="text-pink-500">in</span> <span class="text-blue-400">range</span>(i+<span class="text-amber-400">1</span>, <span class="text-blue-400">len</span>(mark)):</div>
                    <div class="code-line py-1 px-2 rounded pl-12" id="line-4"><span class="text-pink-500">if</span> mark[j] &gt; mark[max_index]:</div>
                    <div class="code-line py-1 px-2 rounded pl-18 ml-6" id="line-5">max_index = j</div>
                    <div class="code-line py-1 px-2 rounded pl-6 mt-2" id="line-6">temp = mark[i]</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-7">mark[i] = mark[max_index]</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-8">mark[max_index] = temp</div>
                `;
                document.getElementById('label-target-idx').innerText = "最大值索引 (max_index)";
            } else {
                codeBox.innerHTML = `
                    <div class="code-line py-1 px-2 rounded" id="line-1"><span class="text-pink-500">for</span> i <span class="text-pink-500">in</span> <span class="text-blue-400">range</span>(<span class="text-amber-400">0</span>, <span class="text-blue-400">len</span>(mark)):</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-2">min_index = i</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-3"><span class="text-pink-500">for</span> j <span class="text-pink-500">in</span> <span class="text-blue-400">range</span>(i+<span class="text-amber-400">1</span>, <span class="text-blue-400">len</span>(mark)):</div>
                    <div class="code-line py-1 px-2 rounded pl-12 text-orange-400 font-bold" id="line-4"><span class="text-pink-500">if</span> mark[j] &lt; mark[min_index]:</div>
                    <div class="code-line py-1 px-2 rounded pl-18 ml-6 text-orange-400 font-bold" id="line-5">min_index = j</div>
                    <div class="code-line py-1 px-2 rounded pl-6 mt-2" id="line-6">temp = mark[i]</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-7">mark[i] = mark[min_index]</div>
                    <div class="code-line py-1 px-2 rounded pl-6" id="line-8">mark[min_index] = temp</div>
                `;
                document.getElementById('label-target-idx').innerText = "最小值索引 (min_index)";
            }
        }

        // 生成所有排序步驟狀態 (State Generator Engine)
        function generateStates() {
            states = [];
            let tempMark = [...mark];
            const n = tempMark.length;

            // 狀態 0：初始狀態
            states.push({
                line: 0,
                mark: [...tempMark],
                i: '-',
                j: '-',
                targetIndex: '-',
                temp: '-',
                explainTitle: "準備開始",
                explainDesc: sortMode === 'DESC' 
                    ? "我們準備好要把這排學生「由大至小（從左到右）」排好了！" 
                    : "試想想：我們要把這排學生「由小至大（從左到右）」排好！",
                sortedCount: 0,
                compareIndex: null,
                swapA: null,
                swapB: null
            });

            for (let i = 0; i < n; i++) {
                // 第一步：進入外圈循環，i 定位
                states.push({
                    line: 1,
                    mark: [...tempMark],
                    i: i,
                    j: '-',
                    targetIndex: '-',
                    temp: '-',
                    explainTitle: `外圈循環 i = ${i}`,
                    explainDesc: `鎖定當前尚未排序隊伍的第一個位置 index ${i}。我們要在後面的學生中找出極值來跟此位置交換。`,
                    sortedCount: i,
                    compareIndex: null,
                    swapA: null,
                    swapB: null
                });

                // 第二步：初始化極值索引
                let targetIdx = i;
                states.push({
                    line: 2,
                    mark: [...tempMark],
                    i: i,
                    j: '-',
                    targetIndex: targetIdx,
                    temp: '-',
                    explainTitle: `初始化極值索引`,
                    explainDesc: `先假設最左邊未排序的學生（index ${i}，身高 ${tempMark[i]}cm）就是目前我們要找的${sortMode === 'DESC' ? '最高者' : '最矮者'}。`,
                    sortedCount: i,
                    compareIndex: null,
                    swapA: null,
                    swapB: null
                });

                // 內圈循環
                for (let j = i + 1; j < n; j++) {
                    // 第三步：進入內圈 for
                    states.push({
                        line: 3,
                        mark: [...tempMark],
                        i: i,
                        j: j,
                        targetIndex: targetIdx,
                        temp: '-',
                        explainTitle: `掃描比對 j = ${j}`,
                        explainDesc: `指標 j 移到 ${j}，準備把這位同學（${tempMark[j]}cm）跟目前我們記錄的極值同學（${tempMark[targetIdx]}cm）做身高對比。`,
                        sortedCount: i,
                        compareIndex: j,
                        swapA: null,
                        swapB: null
                    });

                    // 第四步：判斷條件
                    let condition = sortMode === 'DESC' 
                        ? tempMark[j] > tempMark[targetIdx] 
                        : tempMark[j] < tempMark[targetIdx];
                    
                    states.push({
                        line: 4,
                        mark: [...tempMark],
                        i: i,
                        j: j,
                        targetIndex: targetIdx,
                        temp: '-',
                        explainTitle: `條件判斷 (if 比較)`,
                        explainDesc: sortMode === 'DESC' 
                            ? `比較：j 的身高 ${tempMark[j]}cm 是否大於當前最高者 ${tempMark[targetIdx]}cm？ ${condition ? '是的！' : '沒有。'}`
                            : `比較：j 的身高 ${tempMark[j]}cm 是否小於當前最矮者 ${tempMark[targetIdx]}cm？ ${condition ? '是的！' : '沒有。'}`,
                        sortedCount: i,
                        compareIndex: j,
                        swapA: null,
                        swapB: null
                    });

                    if (condition) {
                        targetIdx = j;
                        // 第五步：更換極值 index
                        states.push({
                            line: 5,
                            mark: [...tempMark],
                            i: i,
                            j: j,
                            targetIndex: targetIdx,
                            temp: '-',
                            explainTitle: `更新極值標記`,
                            explainDesc: sortMode === 'DESC'
                                ? `發現更高的學生！將最 ${sortMode === 'DESC' ? '高' : '矮'}者的位置更新為 index ${targetIdx}（${tempMark[targetIdx]}cm）。`
                                : `發現更矮的學生！將最 ${sortMode === 'DESC' ? '高' : '矮'}者的位置更新為 index ${targetIdx}（${tempMark[targetIdx]}cm）。`,
                            sortedCount: i,
                            compareIndex: j,
                            swapA: null,
                            swapB: null
                        });
                    }
                }

                // 內圈結束，準備交換
                // 第六步：temp = mark[i]
                states.push({
                    line: 6,
                    mark: [...tempMark],
                    i: i,
                    j: '-',
                    targetIndex: targetIdx,
                    temp: tempMark[i],
                    explainTitle: `準備交換：備份數值 (temp)`,
                    explainDesc: `掃描完畢！現在要進行位置交換。先用暫存變數 temp 記下 index ${i} 的學生身高 ${tempMark[i]}cm。`,
                    sortedCount: i,
                    compareIndex: null,
                    swapA: i,
                    swapB: targetIdx
                });

                // 第七步：mark[i] = mark[targetIdx]
                let prevIValue = tempMark[i];
                tempMark[i] = tempMark[targetIdx];
                states.push({
                    line: 7,
                    mark: [...tempMark],
                    i: i,
                    j: '-',
                    targetIndex: targetIdx,
                    temp: prevIValue,
                    explainTitle: `位置替換`,
                    explainDesc: `把剛剛找到的${sortMode === 'DESC' ? '最高' : '最矮'}者（index ${targetIdx}，${tempMark[targetIdx]}cm）搬到前面 index ${i} 的位置。`,
                    sortedCount: i,
                    compareIndex: null,
                    swapA: i,
                    swapB: targetIdx
                });

                // 第八步：mark[targetIdx] = temp
                tempMark[targetIdx] = prevIValue;
                states.push({
                    line: 8,
                    mark: [...tempMark],
                    i: i,
                    j: '-',
                    targetIndex: targetIdx,
                    temp: prevIValue,
                    explainTitle: `完成交換！`,
                    explainDesc: `把備份在 temp 的同學（${prevIValue}cm）補到 index ${targetIdx} 的空位。此時 index ${i} 的同學已被完美定位！`,
                    sortedCount: i + 1,
                    compareIndex: null,
                    swapA: i,
                    swapB: targetIdx
                });
            }

            // 完成排序
            states.push({
                line: 0,
                mark: [...tempMark],
                i: '-',
                j: '-',
                targetIndex: '-',
                temp: '-',
                explainTitle: `🎉 全體排隊完成！`,
                explainDesc: sortMode === 'DESC' 
                    ? `太棒了！所有的學生都已經「由大至小（降序）」整齊地排好囉！`
                    : `真聰明！只要修改第四行的運算符，所有的學生就成功「由小至大（升序）」排好囉！`,
                sortedCount: n,
                compareIndex: null,
                swapA: null,
                swapB: null
            });
        }

        // 渲染指定步驟的視覺狀態 (State Renderer)
        function renderState(stateIndex) {
            const state = states[stateIndex];
            if (!state) return;

            // 更新變數監控面板
            document.getElementById('var-i').innerText = state.i;
            document.getElementById('var-j').innerText = state.j;
            document.getElementById('var-target-idx').innerText = state.targetIndex;
            document.getElementById('var-temp').innerText = state.temp !== '-' ? `${state.temp} cm` : '-';
            
            if (state.targetIndex !== '-') {
                document.getElementById('var-target-height').innerText = `身高: ${state.mark[state.targetIndex]} cm`;
            } else {
                document.getElementById('var-target-height').innerText = '身高: - cm';
            }

            // 更新中文解說
            document.getElementById('explain-title').innerText = state.explainTitle;
            document.getElementById('explain-desc').innerText = state.explainDesc;

            // 高亮程式碼行
            document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
            if (state.line > 0) {
                const activeLine = document.getElementById(`line-${state.line}`);
                if (activeLine) activeLine.classList.add('active');
            }

            // 更新指標位置 (i, j)
            const rowWidth = document.getElementById('students-row').offsetWidth;
            const colWidth = rowWidth / state.mark.length;

            if (state.i !== '-') {
                document.getElementById('pointer-i').style.display = 'block';
                document.getElementById('pointer-i').style.left = `${state.i * colWidth + (colWidth/2 - 40)}px`;
            } else {
                document.getElementById('pointer-i').style.display = 'none';
            }

            if (state.j !== '-') {
                document.getElementById('pointer-j').style.display = 'block';
                document.getElementById('pointer-j').style.left = `${state.j * colWidth + (colWidth/2 - 40)}px`;
            } else {
                document.getElementById('pointer-j').style.display = 'none';
            }

            // 渲染學生隊伍
            const studentsRow = document.getElementById('students-row');
            studentsRow.innerHTML = '';

            state.mark.forEach((height, idx) => {
                // 計算學生卡片的高度比例 (140cm ~ 190cm 映照到 60% ~ 100% 高度)
                const minH = 140;
                const maxH = 190;
                const percent = 50 + ((height - minH) / (maxH - minH)) * 50;

                // 決定樣式狀態
                let statusClasses = '';
                let extraBadge = '';

                if (idx < state.sortedCount) {
                    statusClasses = 'sorted border-emerald-500 bg-emerald-50/50';
                    extraBadge = `<span class="absolute -top-6 left-1/2 -translate-x-1/2 text-[9px] bg-emerald-500 text-white font-bold px-1 rounded shadow-sm">OK</span>`;
                }

                if (idx === state.compareIndex) {
                    statusClasses = 'comparing border-blue-500 bg-blue-50 animate-pulse';
                }

                if (idx === state.targetIndex) {
                    statusClasses = 'current-best border-yellow-500 bg-yellow-50';
                    const icon = sortMode === 'DESC' ? 'fa-crown text-yellow-500' : 'fa-arrow-down-long text-blue-500';
                    const text = sortMode === 'DESC' ? '當前最高' : '當前最矮';
                    extraBadge = `
                        <div class="absolute -top-7 left-1/2 -translate-x-1/2 flex flex-col items-center animate-bounce">
                            <i class="fa-solid ${icon} text-xs"></i>
                            <span class="text-[9px] bg-yellow-400 text-yellow-950 font-black px-1 rounded shadow-sm leading-tight">${text}</span>
                        </div>
                    `;
                }

                // 判斷是否正在交換中
                if (state.swapA === idx || state.swapB === idx) {
                    if (state.line >= 6 && state.line <= 8) {
                        statusClasses += ' swapping border-dashed border-orange-400 bg-orange-50';
                    }
                }

                // 選定學生的風格主題 (根據初始身高綁定顏色，保證學生身分一致性)
                const origIdx = INITIAL_HEIGHTS.indexOf(height);
                const style = STUDENT_STYLES[origIdx !== -1 ? origIdx : idx % STUDENT_STYLES.length];

                // 生成學生 HTML Card
                const studentCard = document.createElement('div');
                studentCard.className = `student-container flex flex-col items-center justify-end h-full relative`;
                studentCard.style.width = `${colWidth}px`;
                
                studentCard.innerHTML = `
                    <!-- 頂部標籤 -->
                    ${extraBadge}

                    <!-- 學生身軀本體 -->
                    <div class="student-card w-11 md:w-14 rounded-t-2xl border-2 shadow-sm flex flex-col justify-between items-center py-2 relative cursor-pointer ${statusClasses}" style="height: ${percent}%;">
                        
                        <!-- 卡通臉部 -->
                        <div class="text-[10px] md:text-xs font-bold select-none text-slate-700 mt-1">
                            ${style.face}
                        </div>

                        <!-- 身體/衣服圖案 (SVG模擬) -->
                        <div class="w-full px-2 mt-2">
                            <div class="w-full h-4 rounded-md bg-gradient-to-r ${style.bg} flex items-center justify-center text-[8px] text-white font-black">
                                校服
                            </div>
                        </div>

                        <!-- 身高 cm -->
                        <div class="text-xs md:text-sm font-black tracking-tight mt-auto text-slate-800">
                            ${height}
                        </div>
                    </div>

                    <!-- 索引 Index 標籤 -->
                    <div class="mt-2 text-xs font-mono font-bold text-slate-400">
                        [${idx}]
                    </div>
                `;
                studentsRow.appendChild(studentCard);
            });
        }

        // 下一步控制
        function nextStep() {
            if (currentStateIndex < states.length - 1) {
                currentStateIndex++;
                renderState(currentStateIndex);
            } else {
                pause();
            }
        }

        // 上一步控制
        function prevStep() {
            if (currentStateIndex > 0) {
                currentStateIndex--;
                renderState(currentStateIndex);
            }
        }

        // 自動播放/暫停
        function togglePlay() {
            if (playInterval) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            if (currentStateIndex >= states.length - 1) {
                currentStateIndex = 0; // 如果到底了，從頭開始播
            }
            
            document.getElementById('play-icon').className = "fa-solid fa-pause";
            document.getElementById('play-text').innerText = "暫停播放";
            
            // 設定合適的教學動畫展示速度 (1200 毫秒)
            playInterval = setInterval(() => {
                nextStep();
            }, 1200);
        }

        function pause() {
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
            document.getElementById('play-icon').className = "fa-solid fa-play";
            document.getElementById('play-text').innerText = "自動播放";
        }
    </script>
</body>
</html>
