<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JC YUP F.3 虛擬實習時間表 2025–2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg: #faf8f5;
  --bg2: #ffffff;
  --card: #ffffff;
  --accent-bg: #f0ebe4;
  --hover: #e8e2d9;
  --tx: #1a1a2e;
  --tx2: #4a4a5a;
  --tx3: #7a7a8a;
  --accent: #c4632a;
  --accent-lt: #e8884d;
  --accent-bg2: #fdf0e8;
  --teal: #1a6b5a;
  --teal-lt: #e6f2ef;
  --navy: #16213e;
  --bdr: #e0dbd4;
  --bdr-lt: #ece8e2;
  --sh-sm: 0 1px 3px rgba(26,26,46,0.06);
  --sh-md: 0 4px 12px rgba(26,26,46,0.08);
  --sh-lg: 0 8px 24px rgba(26,26,46,0.12);
  --r: 12px;
  --r-sm: 8px;
  --r-lg: 16px;
  --tg-g: #e6f2ef; --tg-gt: #1a6b5a;
  --tg-o: #fdf0e8; --tg-ot: #c4632a;
  --tg-b: #e8eef8; --tg-bt: #2a5cb4;
  --d1: #c4632a; --d2: #2a5cb4; --d3: #1a6b5a; --d4: #8b5cf6; --d5: #d4382c;
  --chk-on: #1a6b5a;
  --input-bg: #f7f5f2;
  --rating-1: #e53935; --rating-2: #fb8c00; --rating-3: #fdd835;
  --rating-4: #7cb342; --rating-5: #43a047; --rating-6: #2e7d32;
}

html.dark {
  --bg: #0f1117; --bg2: #1a1d28; --card: #1e2130;
  --accent-bg: #252838; --hover: #2d3145;
  --tx: #e8e6f0; --tx2: #b0aec0; --tx3: #787890;
  --accent: #e8884d; --accent-lt: #f0a060; --accent-bg2: #3a2820;
  --teal: #3dc4a8; --teal-lt: #1a3330;
  --navy: #a0b0d0;
  --bdr: #2a2d3a; --bdr-lt: #23263a;
  --sh-sm: 0 1px 3px rgba(0,0,0,0.3);
  --sh-md: 0 4px 12px rgba(0,0,0,0.4);
  --sh-lg: 0 8px 24px rgba(0,0,0,0.5);
  --tg-g: #1a3330; --tg-gt: #3dc4a8;
  --tg-o: #3a2820; --tg-ot: #f0a060;
  --tg-b: #1a2540; --tg-bt: #6090d0;
  --chk-on: #3dc4a8;
  --input-bg: #252838;
  --rating-1: #ef5350; --rating-2: #ffa726; --rating-3: #ffee58;
  --rating-4: #9ccc65; --rating-5: #66bb6a; --rating-6: #4caf50;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--tx); min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased; }

.hero { background: linear-gradient(135deg, var(--navy) 0%, #2a4060 50%, var(--teal) 100%); padding: 28px 20px 24px; color: #fff; position: relative; overflow: hidden; }
html.dark .hero { background: linear-gradient(135deg, #0a1628 0%, #162040 50%, #0a2a24 100%); }
.hero::before { content:''; position: absolute; top:-60%; right:-20%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%); border-radius: 50%; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
.hero-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
.hero-sub { font-size: 13px; opacity: 0.85; font-weight: 300; }
.hero-dates { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.hero-date-tag { background: rgba(255,255,255,0.15); backdrop-filter: blur(4px); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,0.12); }
.hero-actions { display: flex; gap: 6px; flex-shrink: 0; position: relative; z-index: 2; }
.hero-btn { display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: var(--r-sm); border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.hero-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
.hero-btn i { font-size: 13px; }

.search-bar { padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--bdr); position: sticky; top: 0; z-index: 100; }
.search-wrap { position: relative; max-width: 600px; margin: 0 auto; }
.search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--tx3); font-size: 14px; }
.search-input { width: 100%; padding: 10px 14px 10px 40px; border: 1px solid var(--bdr); border-radius: var(--r); font-size: 16px; font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--tx); transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg2); }
.search-input::placeholder { color: var(--tx3); }

.container { max-width: 900px; margin: 0 auto; padding: 16px 16px 60px; }

.filter-row { display: flex; gap: 6px; padding: 10px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.filter-chip { padding: 5px 12px; border: 1px solid var(--bdr); border-radius: 20px; background: var(--card); font-size: 12px; font-weight: 500; color: var(--tx2); cursor: pointer; white-space: nowrap; transition: all 0.2s; font-family: 'Noto Sans TC', sans-serif; flex-shrink: 0; }
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--accent-bg2); color: var(--accent); margin-left: 4px; }

.group-card { background: var(--card); border: 1px solid var(--bdr-lt); border-radius: var(--r-lg); padding: 16px; margin-bottom: 10px; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s; box-shadow: var(--sh-sm); animation: fadeUp 0.3s ease both; }
.group-card:hover { transform: translateY(-2px); box-shadow: var(--sh-md); border-color: var(--accent); }
@keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
.gc-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.gc-badge { min-width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-lt)); flex-shrink: 0; }
.gc-info { flex: 1; min-width: 0; }
.gc-company { font-size: 15px; font-weight: 600; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.gc-tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
.gc-tag.green { background: var(--tg-g); color: var(--tg-gt); }
.gc-tag.orange { background: var(--tg-o); color: var(--tg-ot); }
.gc-tag.blue { background: var(--tg-b); color: var(--tg-bt); }
.gc-arrow { color: var(--tx3); font-size: 14px; flex-shrink: 0; }

.gc-stu { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bdr-lt); }
.gc-stu-label { font-size: 11px; font-weight: 600; color: var(--tx3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.gc-stu-list { display: flex; flex-wrap: wrap; gap: 5px; }
.stu-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 10px 3px 3px; background: var(--accent-bg); border-radius: 20px; color: var(--tx2); }
.stu-photo-sm { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1.5px solid var(--bdr); }
.stu-photo-md { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid var(--bdr); }
.stu-photo-lg { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 3px solid var(--bdr); }
.stu-num { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 50%; font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; }
.stu-num.c3A { background: #c62828; }
.stu-num.c3B { background: #1565c0; }
.stu-num.c3C { background: #2e7d32; }
.stu-num.c3D { background: #e65100; }

.detail-view { display: none; }
.detail-view.active { display: block; }
.overview-view.hidden { display: none; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 1px solid var(--bdr); border-radius: var(--r-sm); background: var(--card); color: var(--tx2); font-size: 14px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.2s; margin-bottom: 16px; }
.back-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg2); }

.detail-header { background: var(--card); border: 1px solid var(--bdr-lt); border-radius: var(--r-lg); padding: 20px; margin-bottom: 16px; box-shadow: var(--sh-sm); }
.dh-title { font-size: 20px; font-weight: 700; color: var(--tx); margin-bottom: 4px; }
.dh-company { font-size: 14px; color: var(--accent); font-weight: 500; margin-bottom: 12px; word-break: break-all; }
.dh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dh-item { font-size: 13px; color: var(--tx2); }
.dh-item strong { color: var(--tx); font-weight: 600; }

.stu-section { background: var(--card); border: 1px solid var(--bdr-lt); border-radius: var(--r-lg); padding: 18px; margin-bottom: 16px; box-shadow: var(--sh-sm); }
.stu-section-title { font-size: 15px; font-weight: 600; color: var(--tx); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.stu-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.stu-table th { text-align: left; padding: 8px 10px; background: var(--accent-bg); color: var(--tx3); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.stu-table th:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.stu-table th:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.stu-table td { padding: 8px 10px; border-bottom: 1px solid var(--bdr-lt); color: var(--tx2); vertical-align: middle; }
.stu-table tr:last-child td { border-bottom: none; }
.stu-num-lg { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; font-size: 13px; font-weight: 700; color: #fff; }

.c3A { background: #c62828; } .c3B { background: #1565c0; } .c3C { background: #2e7d32; } .c3D { background: #e65100; }
.cls-tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.cls-3A { background: #fce4ec; color: #c62828; } .cls-3B { background: #e3f2fd; color: #1565c0; } .cls-3C { background: #e8f5e9; color: #2e7d32; } .cls-3D { background: #fff3e0; color: #e65100; }
html.dark .cls-3A { background: #3a1520; color: #f48fb1; } html.dark .cls-3B { background: #0d2740; color: #64b5f6; } html.dark .cls-3C { background: #0d2a10; color: #81c784; } html.dark .cls-3D { background: #3a2010; color: #ffb74d; }

.input-section { background: var(--card); border: 1px solid var(--bdr-lt); border-radius: var(--r-lg); padding: 18px; margin-bottom: 16px; box-shadow: var(--sh-sm); }
.input-section-title { font-size: 15px; font-weight: 600; color: var(--tx); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.input-section-title .badge-new { font-size: 10px; padding: 2px 8px; background: var(--accent); color: #fff; border-radius: 10px; font-weight: 600; }

.att-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
.att-table th { text-align: center; padding: 6px 4px; background: var(--accent-bg); color: var(--tx3); font-weight: 600; font-size: 10px; text-transform: uppercase; }
.att-table th:first-child { text-align: left; border-radius: var(--r-sm) 0 0 var(--r-sm); }
.att-table th:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.att-table td { padding: 6px 4px; border-bottom: 1px solid var(--bdr-lt); text-align: center; }
.att-table td:first-child { text-align: left; }
.att-table tr:last-child td { border-bottom: none; }
.att-stu-cell { display: flex; align-items: center; gap: 6px; }

.chk { display: flex; align-items: center; justify-content: center; }
.chk input { display: none; }
.chk label { width: 24px; height: 24px; border: 2px solid var(--bdr); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: var(--card); }
.chk label:hover { border-color: var(--chk-on); }
.chk input:checked + label { background: var(--chk-on); border-color: var(--chk-on); }
.chk input:checked + label::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; font-size: 12px; color: #fff; }

.note-area { width: 100%; padding: 10px 14px; border: 1px solid var(--bdr); border-radius: var(--r-sm); font-size: 16px; font-family: 'Noto Sans TC', sans-serif; background: var(--input-bg); color: var(--tx); resize: vertical; min-height: 60px; outline: none; transition: border-color 0.2s; }
.note-area:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg2); }
.note-area::placeholder { color: var(--tx3); }
.note-label { font-size: 12px; font-weight: 600; color: var(--tx3); margin-bottom: 6px; margin-top: 14px; display: block; }

.stu-note-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.stu-note-name { min-width: 110px; font-size: 12px; font-weight: 500; color: var(--tx2); flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
.stu-note-input { flex: 1; padding: 8px 12px; border: 1px solid var(--bdr); border-radius: var(--r-sm); font-size: 16px; font-family: 'Noto Sans TC', sans-serif; background: var(--input-bg); color: var(--tx); outline: none; transition: border-color 0.2s; }
.stu-note-input:focus { border-color: var(--accent); }

.assess-section { background: var(--card); border: 1px solid var(--bdr-lt); border-radius: var(--r-lg); padding: 18px; margin-bottom: 16px; box-shadow: var(--sh-sm); }
.assess-form { margin-bottom: 16px; padding: 16px; background: var(--accent-bg); border-radius: var(--r); }
.assess-form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: flex-end; }
.assess-form-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.assess-form-field label { font-size: 11px; font-weight: 600; color: var(--tx3); text-transform: uppercase; }
.assess-form-field select, .assess-form-field textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--bdr); border-radius: var(--r-sm); font-size: 16px; font-family: 'Noto Sans TC', sans-serif; background: var(--input-bg); color: var(--tx); outline: none; }
.assess-form-field select:focus, .assess-form-field textarea:focus { border-color: var(--accent); }
.assess-form-field textarea { min-height: 50px; resize: vertical; }

.rating-group { display: flex; gap: 4px; flex-wrap: wrap; }
.rating-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--bdr); background: var(--card); color: var(--tx2); font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans TC', sans-serif; display: flex; align-items: center; justify-content: center; }
.rating-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.1); }
.rating-btn.active { color: #fff; border-color: transparent; transform: scale(1.15); }
.rating-btn.active[data-r="1"] { background: var(--rating-1); }
.rating-btn.active[data-r="2"] { background: var(--rating-2); }
.rating-btn.active[data-r="3"] { background: var(--rating-3); color: #333; }
.rating-btn.active[data-r="4"] { background: var(--rating-4); }
.rating-btn.active[data-r="5"] { background: var(--rating-5); }
.rating-btn.active[data-r="6"] { background: var(--rating-6); }

.assess-submit-btn { padding: 10px 20px; border-radius: var(--r-sm); background: var(--teal); color: #fff; border: none; font-size: 14px; font-weight: 600; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
.assess-submit-btn:hover { background: var(--accent); }
.assess-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.assess-accordion { border: 1px solid var(--bdr-lt); border-radius: var(--r); overflow: hidden; margin-top: 12px; }
.assess-acc-item { border-bottom: 1px solid var(--bdr-lt); }
.assess-acc-item:last-child { border-bottom: none; }
.assess-acc-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; transition: background 0.2s; background: var(--bg); }
.assess-acc-header:hover { background: var(--accent-bg); }
.assess-acc-header .stu-info { flex: 1; display: flex; align-items: center; gap: 8px; }
.assess-acc-header .stu-info span { font-size: 13px; font-weight: 500; color: var(--tx); }
.assess-acc-header .assess-count { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--tg-b); color: var(--tg-bt); font-weight: 600; }
.assess-acc-header .chevron { color: var(--tx3); font-size: 12px; transition: transform 0.2s; }
.assess-acc-header.open .chevron { transform: rotate(90deg); }
.assess-acc-body { display: none; padding: 12px 14px; background: var(--card); }
.assess-acc-body.open { display: block; }

.assess-entry { padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid var(--accent); background: var(--accent-bg); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.assess-entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }
.assess-entry-skill { font-size: 12px; font-weight: 600; color: var(--tx); }
.assess-entry-date { font-size: 11px; color: var(--tx3); }
.assess-entry-rating { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
.assess-entry-note { font-size: 12px; color: var(--tx2); margin-top: 4px; line-height: 1.5; }
.assess-entry-delete { background: none; border: none; color: var(--tx3); cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; transition: all 0.15s; }
.assess-entry-delete:hover { color: #e53935; background: rgba(229,57,53,0.1); }

.chart-container { margin-top: 12px; margin-bottom: 12px; padding: 16px; background: var(--bg); border-radius: var(--r); border: 1px solid var(--bdr-lt); }
.chart-container canvas { max-width: 100%; }

.day-tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.day-tab { padding: 8px 14px; border: 1px solid var(--bdr); border-radius: var(--r-sm); background: var(--card); color: var(--tx2); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; font-family: 'Noto Sans TC', sans-serif; flex-shrink: 0; }
.day-tab:hover { border-color: var(--accent); color: var(--accent); }
.day-tab.active { color: #fff; border-color: transparent; }
.day-tab.active[data-day="0"] { background: var(--d1); }
.day-tab.active[data-day="1"] { background: var(--d2); }
.day-tab.active[data-day="2"] { background: var(--d3); }
.day-tab.active[data-day="3"] { background: var(--d4); }
.day-tab.active[data-day="4"] { background: var(--d5); }
.day-content { display: none; } .day-content.active { display: block; }
.day-hdr { background: var(--card); border: 1px solid var(--bdr-lt); border-radius: var(--r); padding: 14px; margin-bottom: 12px; box-shadow: var(--sh-sm); }
.day-title { font-size: 15px; font-weight: 600; color: var(--tx); margin-bottom: 4px; }
.day-vask { font-size: 12px; color: var(--tx3); line-height: 1.5; }

.tl { position: relative; padding-left: 20px; }
.tl::before { content:''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--bdr); border-radius: 1px; }
.tl-item { position: relative; margin-bottom: 12px; animation: fadeUp 0.3s ease both; }
.tl-item::before { content:''; position: absolute; left: -16px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); z-index: 1; }
.tl-card { background: var(--card); border: 1px solid var(--bdr-lt); border-radius: var(--r); padding: 14px; box-shadow: var(--sh-sm); transition: border-color 0.2s; }
.tl-card:hover { border-color: var(--accent); }
.tl-time { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.tl-act { font-size: 14px; font-weight: 600; color: var(--tx); margin-bottom: 4px; }
.tl-det { font-size: 12px; color: var(--tx2); line-height: 1.6; }
.tl-plat { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; background: var(--tg-b); color: var(--tg-bt); }

.empty { text-align: center; padding: 40px 20px; color: var(--tx3); }
.empty i { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: var(--r); background: var(--navy); color: #fff; font-size: 14px; font-family: 'Noto Sans TC', sans-serif; box-shadow: var(--sh-lg); z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
html.dark .toast { background: #3dc4a8; color: #0f1117; }
.toast.show { opacity: 1; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: var(--r-lg); padding: 24px; max-width: 480px; width: 100%; box-shadow: var(--sh-lg); max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--tx); }
.modal p { font-size: 13px; color: var(--tx2); margin-bottom: 12px; line-height: 1.6; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal-btn { padding: 8px 18px; border-radius: var(--r-sm); font-size: 14px; font-weight: 500; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.2s; border: 1px solid var(--bdr); }
.modal-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-btn.primary:hover { background: var(--accent-lt); }
.modal-btn.secondary { background: var(--card); color: var(--tx2); }
.modal-btn.secondary:hover { background: var(--accent-bg); }

.file-drop { border: 2px dashed var(--bdr); border-radius: var(--r); padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
.file-drop:hover, .file-drop.dragover { border-color: var(--accent); background: var(--accent-bg2); }
.file-drop i { font-size: 32px; color: var(--tx3); margin-bottom: 8px; }
.file-drop p { font-size: 13px; color: var(--tx3); }
.file-drop input { display: none; }

.data-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 8px; }
.data-dot { width: 8px; height: 8px; border-radius: 50%; }
.data-dot.has-data { background: #4ade80; }
.data-dot.no-data { background: rgba(255,255,255,0.3); }

.detail-nav { display: flex; gap: 4px; margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.detail-nav-btn { padding: 8px 14px; border: 1px solid var(--bdr); border-radius: var(--r-sm); background: var(--card); color: var(--tx2); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; font-family: 'Noto Sans TC', sans-serif; flex-shrink: 0; display: flex; align-items: center; gap: 5px; }
.detail-nav-btn:hover { border-color: var(--teal); color: var(--teal); }
.detail-nav-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }
.detail-panel { display: none; }
.detail-panel.active { display: block; }

@media (max-width: 480px) {
  .hero { padding: 20px 16px; }
  .hero-title { font-size: 17px; }
  .hero-actions { flex-direction: column; gap: 4px; }
  .container { padding: 12px 12px 60px; }
  .group-card { padding: 12px; }
  .gc-badge { min-width: 40px; height: 40px; font-size: 12px; }
  .gc-company { font-size: 13px; }
  .dh-grid { grid-template-columns: 1fr; }
  .day-tab { padding: 6px 10px; font-size: 12px; }
  .stu-table, .att-table { font-size: 11px; }
  .stu-table th, .stu-table td, .att-table th, .att-table td { padding: 5px 6px; }
  .stu-note-row { flex-direction: column; gap: 4px; }
  .stu-note-name { min-width: 0; }
  .assess-form-row { flex-direction: column; }
  .assess-form-field { min-width: 100%; }
  .rating-btn { width: 32px; height: 32px; font-size: 13px; }
  .detail-nav { gap: 3px; }
  .detail-nav-btn { padding: 6px 10px; font-size: 12px; }
}

.assess-questionnaire { margin-top: 12px; max-height: 60vh; overflow-y: auto; padding: 4px; }
.assess-cat-group { margin-bottom: 14px; }
.assess-cat-title { font-size: 12px; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: 0.3px; padding: 6px 10px; background: var(--teal-lt); border-radius: var(--r-sm); margin-bottom: 6px; }
.assess-q-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--bdr-lt); flex-wrap: wrap; }
.assess-q-item:last-child { border-bottom: none; }
.assess-q-text { flex: 1; font-size: 13px; color: var(--tx); min-width: 160px; line-height: 1.4; }
.assess-q-neg { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: var(--rating-1); color: #fff; margin-left: 4px; vertical-align: middle; }
.assess-q-rating { display: flex; gap: 3px; flex-shrink: 0; }
.assess-q-rating button { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--bdr); background: var(--card); color: var(--tx2); font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans TC', sans-serif; display: flex; align-items: center; justify-content: center; padding: 0; }
.assess-q-rating button:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.1); }
.assess-q-rating button.active { color: #fff; border-color: transparent; transform: scale(1.1); }
.assess-q-rating button.active[data-r="1"] { background: var(--rating-1); }
.assess-q-rating button.active[data-r="2"] { background: var(--rating-2); }
.assess-q-rating button.active[data-r="3"] { background: var(--rating-3); color: #333; }
.assess-q-rating button.active[data-r="4"] { background: var(--rating-4); }
.assess-q-rating button.active[data-r="5"] { background: var(--rating-5); }
.assess-q-rating button.active[data-r="6"] { background: var(--rating-6); }
.assess-progress { font-size: 12px; font-weight: 600; color: var(--teal); padding: 8px 12px; background: var(--teal-lt); border-radius: var(--r-sm); margin-top: 10px; display: flex; align-items: center; gap: 8px; }
.assess-progress .bar { flex: 1; height: 6px; background: var(--bdr); border-radius: 3px; overflow: hidden; }
.assess-progress .bar-fill { height: 100%; background: var(--teal); border-radius: 3px; transition: width 0.3s; }
.assess-avg-display { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
.assess-skill-tabs { display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 8px 0 8px; margin-bottom: 8px; }
.assess-skill-tab { padding: 6px 12px; border: 1px solid var(--bdr); border-radius: 20px; background: var(--card); color: var(--tx2); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; font-family: 'Noto Sans TC', sans-serif; flex-shrink: 0; }
.assess-skill-tab:hover { border-color: var(--teal); color: var(--teal); }
.assess-skill-tab.active { background: var(--teal); color: #fff; border-color: var(--teal); }
.assess-summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-top: 8px; }
.assess-detail-list { margin-top: 8px; padding: 8px; background: var(--bg); border-radius: var(--r-sm); font-size: 11px; line-height: 1.8; color: var(--tx2); max-height: 200px; overflow-y: auto; }
.assess-detail-list .q-line { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; border-bottom: 1px solid var(--bdr-lt); }
.assess-detail-list .q-line:last-child { border-bottom: none; }
@media (max-width: 480px) {
  .assess-q-item { padding: 6px 6px; gap: 6px; }
  .assess-q-text { font-size: 12px; min-width: 120px; }
  .assess-q-rating button { width: 26px; height: 26px; font-size: 11px; }
  .assess-skill-tab { padding: 5px 9px; font-size: 11px; }
  .assess-questionnaire { max-height: 50vh; }
}
</style>
</head>
<body>

<div class="hero">
  <div style="max-width:900px;margin:0 auto;">
    <div class="hero-top">
      <div>
        <div class="hero-title">JC YUP F.3 Virtual Internship</div>
        <div class="hero-sub">BHSS 虛擬實習時間表 2025–2026</div>
      </div>
      <div class="hero-actions">
        <button class="hero-btn" onclick="showImportModal()"><i class="fas fa-file-import"></i> 匯入</button>
        <button class="hero-btn" onclick="exportData()"><i class="fas fa-file-export"></i> 匯出</button>
      </div>
    </div>
    <div class="hero-dates">
      <span class="hero-date-tag">Day 1: 25/6 (四)</span>
      <span class="hero-date-tag">Day 2: 26/6 (五)</span>
      <span class="hero-date-tag">Day 3: 29/6 (一)</span>
      <span class="hero-date-tag">Day 4: 30/6 (二)</span>
      <span class="hero-date-tag">Day 5: 2/7 (四)</span>
    </div>
    <div class="data-status" id="dataStatus">
      <span class="data-dot no-data" id="dataDot"></span>
      <span id="dataStatusText">尚未輸入老師記錄</span>
    </div>
  </div>
</div>

<div class="search-bar" id="searchBar">
  <div class="search-wrap">
    <i class="fas fa-search"></i>
    <input type="text" class="search-input" id="searchInput" placeholder="搜尋組別、公司、學生姓名...">
  </div>
</div>

<div class="container">
  <div class="overview-view" id="overviewView">
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-filter="all">全部 <span class="count-badge" id="countAll">25</span></button>
      <button class="filter-chip" data-filter="can-attend">可參加講座</button>
      <button class="filter-chip" data-filter="conflict">Zoom 相撞</button>
    </div>
    <div id="groupList"></div>
    <div class="empty" id="emptyState" style="display:none;"><i class="fas fa-search"></i><p>找不到符合的結果</p></div>
  </div>
  <div class="detail-view" id="detailView">
    <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> 返回總覽</button>
    <div id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h3><i class="fas fa-file-import"></i> 匯入資料</h3>
    <p>上載先前匯出的 JSON 檔案，即可還原所有記錄（出席、備註、評估等）。匯入後會覆蓋目前的所有記錄。</p>
    <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
      <i class="fas fa-cloud-upload-alt"></i>
      <p>點擊選擇檔案，或拖放 JSON 檔案到此處</p>
      <input type="file" id="fileInput" accept=".json">
    </div>
    <div id="importPreview" style="display:none; margin-top:12px;"></div>
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="closeImportModal()">取消</button>
      <button class="modal-btn primary" id="importConfirmBtn" onclick="confirmImport()" style="display:none;">確認匯入</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="exportInfoModal">
  <div class="modal">
    <h3><i class="fas fa-file-export"></i> 匯出資料說明</h3>
    <div id="exportInfoContent"></div>
    <div class="modal-btns">
      <button class="modal-btn primary" onclick="closeExportInfo()">知道了</button>
    </div>
  </div>
</div>

// ===== Teacher Data Store =====
var teacherData = {};

function stuKey(s) { return s.c + '-' + s.num; }

function getPhoto(s) {
  var key = s.c + '-' + s.num;
  var b64 = PHOTOS[key];
  if (!b64) return '';
  return 'data:image/jpeg;base64,' + b64;
}

function photoImg(s, cls) {
  var src = getPhoto(s);
  if (!src) return '<span class="stu-num c' + s.c + '" style="width:' + (cls === 'stu-photo-sm' ? '24px;height:24px;font-size:9px' : cls === 'stu-photo-md' ? '40px;height:40px;font-size:12px' : '80px;height:80px;font-size:20px') + '">' + esc(s.num) + '</span>';
  return '<img src="' + src + '" class="' + cls + '" alt="">';
}

function getAttendance(gid, s, day) {
  var d = teacherData[gid];
  if (!d || !d.attendance) return false;
  var k = stuKey(s);
  return d.attendance[k] && d.attendance[k][day] === true;
}

function setAttendance(gid, s, day, val) {
  if (!teacherData[gid]) teacherData[gid] = {};
  if (!teacherData[gid].attendance) teacherData[gid].attendance = {};
  var k = stuKey(s);
  if (!teacherData[gid].attendance[k]) teacherData[gid].attendance[k] = {};
  teacherData[gid].attendance[k][day] = val;
  updateDataStatus();
}

function getGroupNote(gid) {
  return (teacherData[gid] && teacherData[gid].groupNote) || '';
}

function setGroupNote(gid, val) {
  if (!teacherData[gid]) teacherData[gid] = {};
  teacherData[gid].groupNote = val;
  updateDataStatus();
}

function getStuNote(gid, s) {
  return (teacherData[gid] && teacherData[gid].studentNotes && teacherData[gid].studentNotes[stuKey(s)]) || '';
}

function setStuNote(gid, s, val) {
  if (!teacherData[gid]) teacherData[gid] = {};
  if (!teacherData[gid].studentNotes) teacherData[gid].studentNotes = {};
  teacherData[gid].studentNotes[stuKey(s)] = val;
  updateDataStatus();
}

// ===== Assessments =====
var currentAssessRatings = {};
var currentAssessSkill = null;

function getAssessments(gid, s) {
  if (!teacherData[gid] || !teacherData[gid].assessments) return [];
  var k = stuKey(s);
  return teacherData[gid].assessments[k] || [];
}

function addAssessment(gid, s, skillId, ratings, note) {
  if (!teacherData[gid]) teacherData[gid] = {};
  if (!teacherData[gid].assessments) teacherData[gid].assessments = {};
  var k = stuKey(s);
  if (!teacherData[gid].assessments[k]) teacherData[gid].assessments[k] = [];
  teacherData[gid].assessments[k].push({
    skill: skillId,
    ratings: ratings,
    note: note,
    date: new Date().toISOString()
  });
  updateDataStatus();
}

function deleteAssessment(gid, s, idx) {
  var k = stuKey(s);
  if (teacherData[gid] && teacherData[gid].assessments && teacherData[gid].assessments[k]) {
    teacherData[gid].assessments[k].splice(idx, 1);
    if (teacherData[gid].assessments[k].length === 0) {
      delete teacherData[gid].assessments[k];
    }
    updateDataStatus();
  }
}

function getLatestRatings(gid, s) {
  var entries = getAssessments(gid, s);
  var latest = {};
  entries.forEach(function(e) {
    if (!latest[e.skill] || new Date(e.date) > new Date(latest[e.skill].date)) {
      latest[e.skill] = e;
    }
  });
  return latest;
}

function calcSkillAvg(skillId, ratings) {
  var skill = SKILLS.find(function(sk) { return sk.id === skillId; });
  if (!skill || !ratings) return 0;
  var sum = 0, count = 0;
  skill.qs.forEach(function(q) {
    if (ratings[q.n] !== undefined) {
      var val = ratings[q.n];
      if (q.neg) val = 7 - val;
      sum += val;
      count++;
    }
  });
  return count > 0 ? Math.round((sum / count) * 10) / 10 : 0;
}

function getEntryAvg(entry) {
  if (!entry) return 0;
  // Handle old format (single rating)
  if (entry.rating !== undefined && entry.ratings === undefined) {
    return entry.rating;
  }
  return calcSkillAvg(entry.skill, entry.ratings);
}

function getEntryAnsweredCount(entry) {
  if (!entry) return 0;
  if (entry.rating !== undefined && entry.ratings === undefined) return 1;
  if (!entry.ratings) return 0;
  return Object.keys(entry.ratings).length;
}

function getSkillTotalQuestions(skillId) {
  var skill = SKILLS.find(function(sk) { return sk.id === skillId; });
  return skill ? skill.qs.length : 0;
}

// ===== Data Status =====
function hasAnyData() {
  for (var gid in teacherData) {
    var d = teacherData[gid];
    if (d.groupNote) return true;
    if (d.attendance) { for (var k in d.attendance) { for (var day in d.attendance[k]) { if (d.attendance[k][day]) return true; } } }
    if (d.studentNotes) { for (var k2 in d.studentNotes) { if (d.studentNotes[k2]) return true; } }
    if (d.assessments) { for (var k3 in d.assessments) { if (d.assessments[k3] && d.assessments[k3].length) return true; } }
  }
  return false;
}

function countDataEntries() {
  var c = 0;
  for (var gid in teacherData) {
    var d = teacherData[gid];
    if (d.groupNote) c++;
    if (d.attendance) { for (var k in d.attendance) { for (var day in d.attendance[k]) { if (d.attendance[k][day]) c++; } } }
    if (d.studentNotes) { for (var k2 in d.studentNotes) { if (d.studentNotes[k2]) c++; } }
    if (d.assessments) { for (var k3 in d.assessments) { if (d.assessments[k3]) c += d.assessments[k3].length; } }
  }
  return c;
}

function updateDataStatus() {
  var dot = document.getElementById('dataDot');
  var txt = document.getElementById('dataStatusText');
  if (hasAnyData()) {
    dot.className = 'data-dot has-data';
    txt.textContent = '\u5df2\u6709 ' + countDataEntries() + ' \u9805\u8a18\u9304\uff08\u8a18\u5f97\u532f\u51fa\u4fdd\u5b58\uff01\uff09';
  } else {
    dot.className = 'data-dot no-data';
    txt.textContent = '\u5c1a\u672a\u8f38\u5165\u8001\u5e2b\u8a18\u9304';
  }
}

// ===== Utils =====
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function formatDate(isoStr) {
  var d = new Date(isoStr);
  var pad = function(n) { return n < 10 ? '0'+n : n; };
  return d.getFullYear() + '/' + pad(d.getMonth()+1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function ratingColor(r) {
  var colors = ['','var(--rating-1)','var(--rating-2)','var(--rating-3)','var(--rating-4)','var(--rating-5)','var(--rating-6)'];
  return colors[r] || '';
}

// ===== Rendering =====
var curFilter = 'all', curSearch = '';

function renderList() {
  var list = document.getElementById('groupList');
  var html = '', count = 0;

  GROUPS.forEach(function(g, idx) {
    if (curFilter === 'can-attend' && g.lec !== 'can') return;
    if (curFilter === 'conflict' && g.lec !== 'conflict') return;

    var students = STU[g.id] || [];
    if (curSearch) {
      var q = curSearch.toLowerCase();
      var haystack = (g.id + ' ' + g.co + ' ' + g.tc + ' ' + g.rm + ' ' + g.em).toLowerCase();
      students.forEach(function(s) { haystack += ' ' + s.cn + ' ' + s.en + ' ' + s.c + s.num; });
      if (haystack.indexOf(q) === -1) return;
    }

    count++;
    var lecTag = g.lec === 'can' ? '<span class="gc-tag green">\u53ef\u53c3\u52a0\u8b1b\u5ea7</span>' : '<span class="gc-tag orange">Zoom \u76f8\u649e</span>';

    html += '<div class="group-card" onclick="showDetail(\'' + g.id + '\')" style="animation-delay:' + (idx * 0.025) + 's">';
    html += '<div class="gc-head">';
    html += '<div class="gc-badge">' + esc(g.id) + '</div>';
    html += '<div class="gc-info">';
    html += '<div class="gc-company">' + esc(g.co) + '</div>';
    html += '<div class="gc-meta">';
    html += '<span class="gc-tag blue"><i class="fas fa-chalkboard-teacher"></i> ' + esc(g.tc) + '</span>';
    html += '<span class="gc-tag blue"><i class="fas fa-door-open"></i> ' + esc(g.rm) + '</span>';
    html += lecTag + '</div></div>';
    html += '<span class="gc-arrow"><i class="fas fa-chevron-right"></i></span></div>';

    // Students with photos
    html += '<div class="gc-stu"><div class="gc-stu-label"><i class="fas fa-users"></i> \u7d44\u54e1 (' + students.length + '\u4eba)</div>';
    html += '<div class="gc-stu-list">';
    students.forEach(function(s) {
      html += '<span class="stu-chip">' + photoImg(s, 'stu-photo-sm') + ' ' + esc(s.cn) + '</span>';
    });
    html += '</div></div></div>';
  });

  list.innerHTML = html;
  document.getElementById('countAll').textContent = count;
  document.getElementById('emptyState').style.display = count === 0 ? 'block' : 'none';
}

function switchPanel(btn) {
  var panel = btn.getAttribute('data-panel');
  document.querySelectorAll('.detail-nav-btn').forEach(function(b) { b.classList.remove('active'); });

    setTimeout(function() { drawAllCharts(currentGroupId); }, 100);
    if (currentAssessSkill) {
      setTimeout(function() { renderQuestionnaire(currentAssessSkill); }, 50);
    }
  }
}

function toggleAccordion(header) {
  var body = header.nextElementSibling;
  header.classList.toggle('open');
  body.classList.toggle('open');
  if (body.classList.contains('open') && currentGroupId) {
    setTimeout(function() { drawAllCharts(currentGroupId); }, 50);
  }
}

// ===== Assessment Form =====

function switchAssessSkill(skillId) {
  currentAssessSkill = skillId;
  currentAssessRatings = {};
  document.querySelectorAll('.assess-skill-tab').forEach(function(tab) {
    tab.classList.toggle('active', tab.getAttribute('data-skill') === skillId);
  });
  renderQuestionnaire(skillId);
  updateAssessProgress();
  document.getElementById('assessSubmitBtn').disabled = true;
}

function renderQuestionnaire(skillId) {
  var container = document.getElementById('assessQuestionnaire');
  if (!container) return;
  var skill = SKILLS.find(function(sk) { return sk.id === skillId; });
  if (!skill) { container.innerHTML = ''; return; }

  var scaleLabels = SCALE_LABELS[skill.scale];
  var cats = [];
  var catMap = {};
  skill.qs.forEach(function(q) {
    if (!catMap[q.cat]) {
      catMap[q.cat] = [];
      cats.push(q.cat);
    }
    catMap[q.cat].push(q);
  });

  var html = '';
  cats.forEach(function(cat) {
    html += '<div class="assess-cat-group">';
    html += '<div class="assess-cat-title">' + esc(cat) + '</div>';
    catMap[cat].forEach(function(q) {
      html += '<div class="assess-q-item">';
      html += '<div class="assess-q-text">Q' + q.n + '. ' + esc(q.q);
      if (q.neg) html += ' <span class="assess-q-neg">\u53cd\u5411</span>';
      html += '</div>';
      html += '<div class="assess-q-rating">';
      for (var r = 1; r <= 6; r++) {
        var isActive = currentAssessRatings[q.n] === r;
        html += '<button type="button" data-r="' + r + '"' + (isActive ? ' class="active"' : '') + ' onclick="selectQuestionRating(' + q.n + ',' + r + ')" title="' + r + ' - ' + esc(scaleLabels[r-1]) + '">' + r + '</button>';
      }
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  });

  container.innerHTML = html;
  updateAssessProgress();
}

function selectQuestionRating(qNum, rating) {
  currentAssessRatings[qNum] = rating;
  // Update button states for this question
  var container = document.getElementById('assessQuestionnaire');
  if (!container) return;
  var items = container.querySelectorAll('.assess-q-item');
  items.forEach(function(item) {
    var buttons = item.querySelectorAll('.assess-q-rating button');
    if (buttons.length > 0) {
      var firstBtn = buttons[0];
      // Check if this is the right question by checking onclick
      var onclickStr = firstBtn.getAttribute('onclick') || '';
      if (onclickStr.indexOf('selectQuestionRating(' + qNum + ',') === 0) {
        buttons.forEach(function(btn) {
          var r = parseInt(btn.getAttribute('data-r'));
          btn.classList.toggle('active', r === rating);
        });
      }
    }
  });
  updateAssessProgress();
  // Enable submit if at least 1 question rated
  var btn = document.getElementById('assessSubmitBtn');
  if (btn) btn.disabled = Object.keys(currentAssessRatings).length === 0;
}

function updateAssessProgress() {
  var skill = SKILLS.find(function(sk) { return sk.id === currentAssessSkill; });
  var total = skill ? skill.qs.length : 0;
  var answered = Object.keys(currentAssessRatings).length;
  var txt = document.getElementById('assessProgressText');
  var bar = document.getElementById('assessProgressBar');
  if (txt) txt.textContent = '\u5df2\u5b8c\u6210 ' + answered + '/' + total + ' \u984c';
  if (bar) bar.style.width = (total > 0 ? Math.round(answered / total * 100) : 0) + '%';
}

function submitAssessment() {
  var stuIdx = parseInt(document.getElementById('assessStu').value);
  var note = document.getElementById('assessNote').value.trim();
  var students = STU[currentGroupId] || [];
  var s = students[stuIdx];
  if (!s || !currentAssessSkill || Object.keys(currentAssessRatings).length === 0) return;

  addAssessment(currentGroupId, s, currentAssessSkill, JSON.parse(JSON.stringify(currentAssessRatings)), note);

  currentAssessRatings = {};
  document.getElementById('assessNote').value = '';
  document.getElementById('assessSubmitBtn').disabled = true;

  showToast('\u8a55\u4f30\u5df2\u63d0\u4ea4');
  showDetail(currentGroupId);
  var assessBtn = document.querySelector('.detail-nav-btn[data-panel="assessment"]');
  if (assessBtn) switchPanel(assessBtn);
}

function deleteAssessmentEntry(gid, cls, num, idx) {
  deleteAssessment(gid, {c: cls, num: num}, idx);
  showDetail(gid);
  var assessBtn = document.querySelector('.detail-nav-btn[data-panel="assessment"]');
  if (assessBtn) switchPanel(assessBtn);
  showToast('\u5df2\u522a\u9664\u8a55\u4f30\u8a18\u9304');
}

function toggleDetailList(btn) {
  var entry = btn.closest('.assess-entry');
  if (!entry) return;
  var detailList = entry.querySelector('.assess-detail-list');
  if (!detailList) return;
  var isHidden = detailList.style.display === 'none';
  detailList.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '\u6536\u8d77\u8a73\u7d30' : '\u5c55\u958b\u8a73\u7d30';

// ===== Bar Chart =====
function drawAllCharts(gid) {
  var students = STU[gid] || [];
  students.forEach(function(s, i) {
    var canvas = document.getElementById('chart_' + gid + '_' + i);
    if (!canvas) return;
    if (!canvas.offsetParent) return;
    var entries = getAssessments(gid, s);
    if (entries.length === 0) { canvas.parentElement.style.display = 'none'; return; }
    canvas.parentElement.style.display = 'block';
    drawBarChart(canvas, getLatestRatings(gid, s));
  });
}

function drawBarChart(canvas, latestRatings) {
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.parentElement.clientWidth - 32;
  if (w < 200) w = 280;
  var h = 180;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  var isDark = document.documentElement.classList.contains('dark');
  var textColor = isDark ? '#b0aec0' : '#4a4a5a';
  var gridColor = isDark ? '#2a2d3a' : '#e0dbd4';

  ctx.clearRect(0, 0, w, h);

  var barColors = ['#e53935','#fb8c00','#fdd835','#7cb342','#43a047','#2e7d32'];
  var margin = {top: 20, right: 10, bottom: 55, left: 30};
  var chartW = w - margin.left - margin.right;
  var chartH = h - margin.top - margin.bottom;

  // Draw grid
  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 0.5;
  for (var i = 0; i <= 6; i++) {
    var y = margin.top + chartH - (i / 6) * chartH;
    ctx.beginPath();
    ctx.moveTo(margin.left, y);
    ctx.lineTo(w - margin.right, y);
    ctx.stroke();
    if (i > 0) {
      ctx.fillStyle = textColor;
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(i.toString(), margin.left - 4, y + 3);
    }
  }

  // Draw bars
  var numBars = SKILLS.length;
  var barW = Math.min((chartW - (numBars + 1) * 4) / numBars, 24);
  var gap = (chartW - barW * numBars) / (numBars + 1);

  SKILLS.forEach(function(sk, idx) {
    var entry = latestRatings[sk.id];
    var rating = entry ? getEntryAvg(entry) : 0;
    var x = margin.left + gap + idx * (barW + gap);
    var barH = rating > 0 ? (rating / 6) * chartH : 0;
    var y = margin.top + chartH - barH;

    if (rating > 0) {
      var colorIdx = Math.max(0, Math.min(5, Math.round(rating) - 1));
      ctx.fillStyle = barColors[colorIdx];
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, barW, barH, 3);
      } else {
        ctx.rect(x, y, barW, barH);
      }
      ctx.fill();
    }

    // Label
    ctx.save();
    ctx.translate(x + barW / 2, h - margin.bottom + 8);
    ctx.rotate(-Math.PI / 4);
    ctx.fillStyle = textColor;
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'right';
    var label = sk.zh.length > 4 ? sk.zh.substring(0, 4) : sk.zh;
    ctx.fillText(label, 0, 0);
    ctx.restore();
  });
}

// ===== Export =====
function exportData() {
  if (!hasAnyData()) {
    showToast('\u5c1a\u672a\u6709\u4efb\u4f55\u8a18\u9304\u53ef\u532f\u51fa');
    return;
  }

  var exportObj = {
    version: 2,
    exportDate: new Date().toISOString(),
    appName: 'JC YUP F.3 \u865b\u64ec\u5be6\u7fd2 2025-2026',
    teacherData: teacherData
  };

  var json = JSON.stringify(exportObj, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'JC_YUP_F3_records_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  var cnt = countDataEntries();
  var gCnt = Object.keys(teacherData).filter(function(k) { return teacherData[k]; }).length;
  var info = '<p style="margin-bottom:8px;">\u5df2\u6210\u529f\u532f\u51fa JSON \u6a94\u6848\uff1a</p>';
  info += '<div style="background:var(--accent-bg);padding:12px;border-radius:8px;font-size:13px;line-height:1.8;">';
  info += '<strong>\u6db5\u84cb\u7d44\u5225\uff1a</strong>' + gCnt + ' \u7d44<br>';
  info += '<strong>\u8cc7\u6599\u9805\u76ee\uff1a</strong>' + cnt + ' \u9805<br>';
  info += '<strong>\u5305\u542b\u5167\u5bb9\uff1a</strong>\u51fa\u5e2d\u8a18\u9304\u3001\u5099\u8a3b\u3001\u80fd\u529b\u8a55\u4f30';
  info += '</div>';
  info += '<p style="margin-top:12px;font-size:12px;color:var(--tx3);">\u4e0b\u6b21\u4f7f\u7528\u6642\uff0c\u9ede\u64ca\u300c\u532f\u5165\u300d\u6309\u9215\u8f09\u5165\u6b64\u6a94\u6848\u5373\u53ef\u9084\u539f\u6240\u6709\u8a18\u9304\u3002</p>';
  document.getElementById('exportInfoContent').innerHTML = info;
  document.getElementById('exportInfoModal').classList.add('show');
}

function closeExportInfo() {
  document.getElementById('exportInfoModal').classList.remove('show');
}

// ===== Import =====
var pendingImportData = null;

function showImportModal() {
  document.getElementById('importModal').classList.add('show');
  document.getElementById('importPreview').style.display = 'none';
  document.getElementById('importConfirmBtn').style.display = 'none';
  document.getElementById('fileInput').value = '';
  pendingImportData = null;
}

function closeImportModal() {
  document.getElementById('importModal').classList.remove('show');
  pendingImportData = null;
}

function handleFile(file) {
  if (!file || !file.name.endsWith('.json')) {
    showToast('\u8acb\u9078\u64c7 JSON \u6a94\u6848');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.teacherData) {
        showToast('\u6a94\u6848\u683c\u5f0f\u4e0d\u6b63\u78ba\uff1a\u627e\u4e0d\u5230\u8a18\u9304\u8cc7\u6599');
        return;
      }
      pendingImportData = data;
      var cnt = countImportEntries(data.teacherData);
      var gCnt = Object.keys(data.teacherData).length;
      var prev = '<div style="background:var(--tg-g);padding:10px;border-radius:8px;font-size:13px;color:var(--tg-gt);">';
      prev += '<i class="fas fa-check-circle"></i> \u6a94\u6848\u8b80\u53d6\u6210\u529f<br>';
      prev += '<strong>\u532f\u51fa\u65e5\u671f\uff1a</strong>' + (data.exportDate ? new Date(data.exportDate).toLocaleString('zh-TW') : '\u672a\u77e5') + '<br>';
      prev += '<strong>\u6db5\u84cb\u7d44\u5225\uff1a</strong>' + gCnt + ' \u7d44<br>';
      prev += '<strong>\u8cc7\u6599\u9805\u76ee\uff1a</strong>' + cnt + ' \u9805';
      prev += '</div>';
      if (hasAnyData()) {
        prev += '<div style="background:var(--tg-o);padding:8px;border-radius:8px;font-size:12px;color:var(--tg-ot);margin-top:8px;"><i class="fas fa-exclamation-triangle"></i> \u6ce8\u610f\uff1a\u532f\u5165\u5f8c\u6703\u8986\u84cb\u76ee\u524d\u7684\u6240\u6709\u8a18\u9304</div>';
      }
      document.getElementById('importPreview').innerHTML = prev;
      document.getElementById('importPreview').style.display = 'block';
      document.getElementById('importConfirmBtn').style.display = 'inline-flex';
    } catch (err) {
      showToast('\u7121\u6cd5\u89e3\u6790\u6a94\u6848\uff1a' + err.message);
    }
  };
  reader.readAsText(file);
}

function countImportEntries(td) {
  var c = 0;
  for (var gid in td) {
    var d = td[gid];
    if (d.groupNote) c++;
    if (d.attendance) { for (var k in d.attendance) { for (var day in d.attendance[k]) { if (d.attendance[k][day]) c++; } } }
    if (d.studentNotes) { for (var k2 in d.studentNotes) { if (d.studentNotes[k2]) c++; } }
    if (d.assessments) { for (var k3 in d.assessments) { if (d.assessments[k3]) c += d.assessments[k3].length; } }
  }
  return c;
}

function confirmImport() {
  if (!pendingImportData || !pendingImportData.teacherData) return;
  teacherData = pendingImportData.teacherData;
  updateDataStatus();
  closeImportModal();
  showToast('\u532f\u5165\u6210\u529f\uff01\u5df2\u8f09\u5165\u6240\u6709\u8a18\u9304');
  if (currentGroupId) {
    showDetail(currentGroupId);
  }
}

// ===== Toast =====
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ===== Events =====
document.getElementById('backBtn').addEventListener('click', goBack);
document.getElementById('searchInput').addEventListener('input', function(e) {
  curSearch = e.target.value.trim();
  renderList();
});
document.getElementById('filterRow').addEventListener('click', function(e) {
  var chip = e.target.closest('.filter-chip');
  if (!chip) return;
  curFilter = chip.getAttribute('data-filter');
  document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.toggle('active', c.getAttribute('data-filter') === curFilter); });
  renderList();
});

// File drag & drop
var dropZone = document.getElementById('fileDrop');
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e) { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
document.getElementById('fileInput').addEventListener('change', function(e) { if (e.target.files.length) handleFile(e.target.files[0]); });

// Close modals on overlay click
document.getElementById('importModal').addEventListener('click', function(e) { if (e.target === this) closeImportModal(); });
document.getElementById('exportInfoModal').addEventListener('click', function(e) { if (e.target === this) closeExportInfo(); });

// ===== Init =====
renderList();
updateDataStatus();

</script>
